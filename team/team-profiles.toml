[accounts]

[accounts.aihubmix]
label = 'AIHubMix'

[accounts.aihubmix.endpoints]
openai_responses = 'http://127.0.0.1:8791/aihubmix/v1'
anthropic = 'https://aihubmix.com'

[accounts.dmxapi]
label = 'DMXAPI'

[accounts.dmxapi.endpoints]
openai_responses = 'http://127.0.0.1:8791/dmxapi/v1'
anthropic = 'https://www.dmxapi.cn'

[accounts.dmxapi.account_probe]
kind = 'dmxapi'
base_url = 'https://www.dmxapi.cn'

[accounts.ucloud]
label = 'UCloud'
codex_responses_storage = 'required'

[accounts.ucloud.endpoints]
openai_responses = 'http://127.0.0.1:8791/ucloud/v1'
anthropic = 'https://api.modelverse.cn'

