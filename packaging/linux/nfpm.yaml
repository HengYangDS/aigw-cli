name: aigw
arch: ${AIGW_NFPM_ARCH}
platform: linux
version: ${AIGW_VERSION}
section: utils
priority: optional
maintainer: Yang HENG <heng.yang.ds@hotmail.com>
description: Cross-platform team CLI for third-party AI API gateway profiles, secrets, routes, and client adapters.
vendor: AIGW CLI
homepage: https://github.com/HengYangDS/aigw-cli
license: MIT
contents:
  - src: ${AIGW_PACKAGE_ROOT}/aigw
    dst: /usr/bin/aigw
    file_info:
      mode: 0755
  - src: ${AIGW_REPO_ROOT}/README.md
    dst: /usr/share/doc/aigw/README.md
    file_info:
      mode: 0644
  - src: ${AIGW_REPO_ROOT}/LICENSE
    dst: /usr/share/doc/aigw/copyright
    file_info:
      mode: 0644
  - src: ${AIGW_REPO_ROOT}/docs/concepts.md
    dst: /usr/share/doc/aigw/concepts.md
    file_info:
      mode: 0644
scripts:
  postinstall: ${AIGW_PACKAGE_ROOT}/postinstall.sh
