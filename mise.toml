min_version = "2026.9.14"

[settings]
legacy_version_file = false
locked = true
not_found_system_fallback = false

[env]
# Repository locks, not user Go settings or a parent workspace, select the build.
GOENV = "off"
GOTOOLCHAIN = "local"
GOWORK = "off"

[vars]
renovate_image = "ghcr.io/renovatebot/renovate:44.115.12@sha256:81f57864f6e70b1d44ae24406473b84fe1ab831ada96ea483bb72c51aacb6000"

[tool_alias]
# Keep npm's native precedence over Node's bundled npm on every platform.
npm = "npm:npm"

[tools]
# Language runtimes
go = "1.27.1"
node = "26.10.0"
npm = "12.1.0"

# Specification and CI modeling
cue = "0.17.1"

# Release transport conformance
gh = "2.101.0"
glab = "1.119.0"

# Build and supply-chain evidence
"github:goreleaser/goreleaser" = "2.18.2"
"github:anchore/syft" = "1.52.0"
# Build with the repository Go compiler; upstream binaries may lag its language.
"go:github.com/google/osv-scanner/v2/cmd/osv-scanner" = "2.6.0"
# Cross-host ad-hoc macOS artifact signing.
"github:indygreg/apple-platform-rs[version_prefix=apple-codesign/]" = "0.29.0"

# Structured data quality
taplo = "0.10.0"

# Static quality
"github:boyter/scc" = "4.1.0"
"github:editorconfig-checker/editorconfig-checker" = "4.0.2"
"github:gitleaks/gitleaks" = "8.30.1"
"github:golangci/golangci-lint" = "2.14.0"
shellcheck = "0.11.0"
"github:rhysd/actionlint" = "1.7.12"
"github:lycheeverse/lychee" = "lychee-v0.24.2"
typos = "1.50.3"

[tasks.bootstrap]
description = "Install this Work Lane's locked repository dependencies."
run = ["go mod tidy -diff", "npm ci --include=dev --ignore-scripts"]

[tasks.check]
description = "Run the complete source and governance gate."
run = "go run ./tools/ci source"

[tasks.native]
description = "Run native acceptance on the current host platform."
run = "go run ./tools/ci native"

[tasks.release]
description = "Build the deterministic portable release matrix without publishing."
run = "go run ./tools/release build dist"

[tasks."release:notary"]
description = "Run Apple notarization on macOS using explicit native arguments."
run = "xcrun notarytool"
raw = true
timeout = "5m"

[tasks.performance]
description = "Measure explicit signed native candidate artifacts with retained Hyperfine samples."
tools."github:sharkdp/hyperfine" = "1.20.0"
run = "go run ./tools/release accept-native"

[tasks."dependencies:resolve"]
description = "Verify two native mise lock refreshes preserve committed tool inputs."
run = [
  "git diff --exit-code HEAD -- mise.toml mise.lock .mise/locks",
  "mise lock --platform {{ os() }}-{{ arch() }}",
  "git diff --exit-code HEAD -- mise.toml mise.lock .mise/locks",
  "mise lock --platform {{ os() }}-{{ arch() }}",
  "git diff --exit-code HEAD -- mise.toml mise.lock .mise/locks",
]

[tasks."dependencies:check"]
description = "Validate dependency policy with a cached pinned Renovate image."
timeout = "2m"
run = """
docker run --pull=never --rm --read-only --network none --tmpfs /tmp:exec,mode=1777 \
  --mount "type=bind,source={{config_root}},target=/workspace,readonly" \
  --workdir /workspace --env HOME=/tmp \
  --entrypoint renovate-config-validator {{vars.renovate_image}} \
  --strict --no-global .config/dependencies/renovate.json5
"""

[tasks."dependencies:inspect"]
description = "Inspect dependencies with a cached pinned Renovate image."
timeout = "2m"
run = """
docker run --pull=never --rm --read-only --network none --tmpfs /tmp:exec,mode=1777 \
  --mount "type=bind,source={{config_root}},target=/workspace,readonly" \
  --workdir /workspace --env HOME=/tmp --env RENOVATE_BASE_DIR=/tmp/renovate \
  --env RENOVATE_CACHE_DIR=/tmp/renovate/cache \
  --env RENOVATE_ONBOARDING=false --env RENOVATE_REQUIRE_CONFIG=ignored \
  --env RENOVATE_GITHUB_TOKEN_WARN=false \
  --env LOG_LEVEL=debug --env LOG_FORMAT=json \
  --env RENOVATE_CONFIG_FILE=/workspace/.config/dependencies/renovate.json5 \
  --entrypoint renovate {{vars.renovate_image}} --platform=local --dry-run=extract
"""
