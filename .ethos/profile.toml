profile_id = "aigw-cli"

[openspec]
material_paths = ["**"]

[proof]
code_correctness_gates = [
  "go-behavior",
  "node-behavior",
  "go-static-analysis",
]

[proof.code_correctness_map]
behavior = "go-behavior"
static-analysis = "go-static-analysis"

# The one Go test attempt writes its JUnit and LCOV reports for ETHOS to judge,
# so no other gate runs that attempt's tests again.
[[proof.gates]]
id = "go-behavior"
kind = "test"
command = [
  "mise",
  "exec",
  "--locked",
  "--",
  "go",
  "run",
  "./tools/coverage",
  "--race",
  "--profile-output",
  "build/verification/coverage/profile.out",
  "--junit-output",
  "{native_output}/go-junit.xml",
  "--lcov-output",
  "{native_output}/go.lcov",
]
verification_providers = ["ethos.adapters.gates.code_quality:behavior_report"]
dimensions = ["behavior", "test", "coverage"]
evidence_class = "proof"
trust_bearing = true
writes_files = true
network_policy = "offline"
# ETHOS's default bound of 600 s is too close: the acceptance package alone took 361 s under
# the race detector and coverage in the check of 5006895d4, and a slot runs at half the
# machine's workers beside another ticket since the host's two slots of 2026-11-23.
timeout_seconds = 1200

[[proof.gates.native_outputs]]
path = "go-junit.xml"
format = "junit-xml"
sessions = ["go"]

[[proof.gates.native_outputs]]
path = "go.lcov"
format = "lcov"
sessions = ["go"]

# The repository's Node adapters, judged from Node's own reports.
[[proof.gates]]
id = "node-behavior"
kind = "test"
command = [
  "mise",
  "exec",
  "--locked",
  "--",
  "node",
  "--test",
  "--experimental-test-coverage",
  "--test-reporter=junit",
  "--test-reporter-destination={native_output}/node-junit.xml",
  "--test-reporter=lcov",
  "--test-reporter-destination={native_output}/node.lcov",
  "tools/ci/test/text.test.mjs",
]
verification_providers = ["ethos.adapters.gates.code_quality:behavior_report"]
dimensions = ["behavior", "test", "coverage"]
evidence_class = "proof"
trust_bearing = true
writes_files = true
network_policy = "offline"

[[proof.gates.native_outputs]]
path = "node-junit.xml"
format = "junit-xml"
sessions = ["node"]

[[proof.gates.native_outputs]]
path = "node.lcov"
format = "lcov"
sessions = ["node"]

[[proof.gates]]
id = "go-static-analysis"
kind = "static"
command = ["mise", "exec", "--locked", "--", "go", "run", "./tools/ci", "quality"]
verification_providers = ["ethos.adapters.gates.code_quality:static_report"]
dimensions = ["static-analysis", "architecture", "format", "governance", "release"]
evidence_class = "proof"
trust_bearing = true
writes_files = true
network_policy = "required"
# The quality run includes the tagged selection-matrix gate (537 s in the proof of 7e64d0b7d); this
# bound outlasts the gate's own, so a hang ends with Go's diagnostics.
timeout_seconds = 3600
