profile_id = "aigw-cli"

[openspec]
material_paths = [
  ".config/**",
  ".ethos/**",
  ".github/**",
  ".gitlab-ci.yml",
  ".gitattributes",
  ".editorconfig",
  "AGENTS.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "README.md",
  "cmd/**",
  "docs/**",
  "go.mod",
  "go.sum",
  "manifests/**",
  "mise.lock",
  "mise.toml",
  "internal/**",
  "openspec/**",
  "packaging/**",
  "scripts/**",
  "tools/**",
]

[proof]
code_correctness_gates = [
  "go-behavior",
  "go-static-analysis",
  "go-vet",
  "staticcheck",
  "errcheck",
  "go-format",
]

[proof.code_correctness_map]
behavior = "go-behavior"
static-analysis = "go-static-analysis"

[[proof.gates]]
id = "go-behavior"
kind = "test"
command = ["mise", "exec", "--locked", "--", "go", "run", "./tools/coverage", "--race"]
dimensions = ["behavior", "test", "coverage"]
evidence_class = "proof"
trust_bearing = true
network_policy = "offline"

[[proof.gates]]
id = "go-static-analysis"
kind = "static"
command = ["mise", "exec", "--locked", "--", "go", "run", "./tools/architecture", "--root", "."]
dimensions = ["static-analysis", "architecture"]
evidence_class = "proof"
trust_bearing = true
network_policy = "offline"

[[proof.gates]]
id = "go-format"
kind = "static"
command = ["mise", "exec", "--locked", "--", "go", "run", "./tools/repository", "--root", ".", "go-format"]
dimensions = ["format"]
evidence_class = "proof"
trust_bearing = true
network_policy = "offline"

[[proof.gates]]
id = "go-vet"
kind = "static"
command = ["mise", "exec", "--locked", "--", "go", "vet", "./..."]
dimensions = ["static-analysis", "vet"]
evidence_class = "proof"
trust_bearing = true
network_policy = "offline"

[[proof.gates]]
id = "staticcheck"
kind = "static"
command = ["mise", "exec", "--locked", "--", "go", "tool", "staticcheck", "-checks=all,-ST1000,-ST1005", "./..."]
dimensions = ["static-analysis", "lint"]
evidence_class = "proof"
trust_bearing = true
network_policy = "offline"

[[proof.gates]]
id = "errcheck"
kind = "static"
command = ["mise", "exec", "--locked", "--", "go", "tool", "errcheck", "./..."]
dimensions = ["static-analysis", "error-handling"]
evidence_class = "proof"
trust_bearing = true
network_policy = "offline"
