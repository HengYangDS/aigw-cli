[publication]
local_verification_command = "tools/ci/scripts/run-local-ci.sh"
local_installation_command = "scripts/install/install.sh --no-path"
gitlab_remote = "origin"
gitlab_ci_surface = ".gitlab-ci.yml"
github_remote = "github"
github_ci_surface = ".github/workflows/verify.yml"

[protected_refs]
branches = ["main", "dev"]
tags = ["v*"]

[host_profile]
provider = "native-release"

[host_profile.surfaces]
verification = ".github/workflows/verify.yml"
installation = "README.md"

[attestation]
formats = ["in-toto-shaped", "slsa-shaped", "spdx-lite"]
signing = "git-ssh"
