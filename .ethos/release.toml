[publication]
local_verification_command = "mise exec --locked -- go run ./tools/ci source"
local_installation_command = "mise exec --locked -- go run ./cmd/aigw install"

[[publication.peers]]
id = "gitlab"
provider = "gitlab"
role = "organization_collaboration"
git_remote = "origin"
capabilities = ["repository", "ci_cd", "publication"]
ci_surface = ".gitlab-ci.yml"

[[publication.peers]]
id = "github"
provider = "github"
role = "public_distribution"
git_remote = "github"
capabilities = ["repository", "ci_cd", "publication"]
ci_surface = ".github/workflows/verify.yml"

[protected_refs]
branches = ["main", "dev"]
tags = ["v*"]

[host_profile]
provider = "native-release"

[host_profile.surfaces]
verification = ".github/workflows/verify.yml"
installation = "README.md"

[attestation]
formats = ["in-toto-shaped", "slsa-shaped", "spdx-lite"]
signing = "git-ssh"
