family = "control-plane"
primary_invariant = "AIGW changes only explicit provider configuration, credentials, routes, and owned client projections."
routing_question = "Does this change alter provider configuration, routing, credentials, projection, portability, or their authority boundary?"
decision_axes = ["lifecycle", "surface", "authority"]
boundary_rules = [
  "External Responses services remain ordinary operator-selected HTTP endpoints.",
  "Existing client sessions, transcripts, item records, and model metadata remain client-owned.",
  "Ordinary provider extension is token-free manifest data; native diagnostics stay optional leaf integrations.",
  "Projection writes are marked, transactional, inspectable, and fail closed.",
  "Publication identity and trust enter only through protected Forge context.",
]
aliases = []

[owner]
package = "aigw-cli"
scope = "Provider-neutral Account, Profile, Route, credential, endpoint, storage-policy, and client-projection control"

[recommended_facets]
lifecycle = ["configuration", "projection", "validation", "publication"]
surface = ["cli", "manifest", "client-projection", "docs", "ci", "openspec"]
authority = ["source", "configuration", "credential", "projection", "claim", "evidence"]

[proof_profile]
default_command = "ethos prove --json"
executed_command = "ethos prove --execute --expect-head <head> --json"
required_gates = ["go-behavior", "go-static-analysis"]
