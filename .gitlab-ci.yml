      export MISE_NETRC_FILE="$mirror_dir/netrc"
      export MISE_NETRC=1
      mirror_base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mise-github/v1/"
      export MISE_URL_REPLACEMENTS="$(printf '{"regex:^https://api[.]github[.]com/repos/([^/]+)/([^/]+)/releases/tags/([^/?]+)$":"%srelease-$1-$2-$3.json","https://github.com/":"%s","https://api.github.com/":"%s"}' "$mirror_base" "$mirror_base" "$mirror_base")"
    - env GODEBUG=http2client=0 mise install --locked
    - mise exec --locked -- go run ./tools/release validate-version-tag
  after_script:
    - if [ -n "${CI_PROJECT_DIR:-}" ] && [ -n "${CI_JOB_ID:-}" ]; then rm -rf -- "$CI_PROJECT_DIR/build/tmp/aigw-mise-mirror-$CI_JOB_ID"; fi
  stage: verify
  tags:
    - ci-macos-arm64-shell
  variables:
    MISE_ENABLE_TOOLS: go
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
release-assets:
  extends:
    - .linux-toolchain
  script:
    - mkdir dist
    - mise exec --locked -- glab release download "$CI_COMMIT_TAG" --repo "$CI_PROJECT_URL" --asset-name 'aigw_*' --asset-name 'checksums.txt*' --dir dist
    - mise exec --locked -- go run ./tools/release verify-artifacts dist
  stage: release
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    AIGW_RELEASE_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ALLOWED_SIGNERS
    AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS
    SSH_ASKPASS_REQUIRE: never
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    MISE_ENABLE_TOOLS: go,glab
  rules:
    - if: $CI_COMMIT_TAG && ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web")
    - when: never
  needs:
    - job: quality
    - job: native-darwin
    - job: native-linux
    - job: native-windows
    - job: linux-secret-service
    - job: release-version
