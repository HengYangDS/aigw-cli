workflow:
  rules:
    # Release headings are valid only after their signed tag exists. Suppress the
    # transient untagged release/* pipeline; the tag is the sole release proof.
    - if: '$CI_COMMIT_BRANCH =~ /^release\// && !$CI_COMMIT_TAG'
      when: never
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//'
      when: never
    - when: always

stages: [verify, package, publish, release]

default:
  image: golang:1.25
  before_script:
    - export GOPROXY="${AIGW_GOPROXY:-https://goproxy.cn,direct}"; . scripts/prepare-ci-go-cache.sh

verify:
  stage: verify
  script:
    - go test -race ./...
    - go vet ./...
    - test -z "$(gofmt -l cmd internal tools)"
    - for script in scripts/*.sh; do sh -n "$script"; done
    - sh scripts/check-package-safety.sh
    - sh scripts/check-product-surface.sh
    - sh scripts/check-retired-residue.sh
    - sh scripts/check-english-text.sh
    - git fetch --tags --force --prune --prune-tags origin
    - 'if test -n "${CI_COMMIT_TAG:-}"; then sh scripts/check-release-tag-signature.sh . "$CI_COMMIT_TAG"; fi'
    - sh scripts/check-governance.sh
    - python3 scripts/check-markdown-presentation.py
    - python3 scripts/check-text-layout.py
    - sh scripts/test-text-layout.sh
    - sh scripts/test-changelog.sh
    - sh scripts/test-release-readiness.sh
    - sh scripts/test-release-artifacts.sh
    - sh scripts/test-publish-github-release.sh
    - sh scripts/test-release-tag-signature.sh
    - sh scripts/test-package-runner-preflight.sh
    - sh scripts/test-linux-native-install-staging.sh
    - sh scripts/test-msi-version.sh
    - sh scripts/test-pipeline-gates.sh
    - sh scripts/test-github-actions-contract.sh
    - sh scripts/test-github-release-workflow.sh
    - sh scripts/test-github-provider-projection.sh
    - go build -o /tmp/aigw-install-smoke ./cmd/aigw
    - sh scripts/test-installers.sh /tmp/aigw-install-smoke
    - sh scripts/test-portable-install.sh /tmp/aigw-install-smoke
    - '! grep -RInE --exclude-dir=.git --exclude="*_test.go" "(sk-[A-Za-z0-9_-]{24,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9_-]{24,})" .'

windows-installer-runtime:
  stage: verify
  tags: [macos]
  before_script: []
  script:
    - command -v pwsh
    - pwsh -NoProfile -NonInteractive -File scripts/test-installers.ps1 -Installer "$CI_PROJECT_DIR/scripts/install.ps1"

windows-native-acceptance:
  stage: verify
  tags: [windows]
  rules:
    - if: '$AIGW_WINDOWS_NATIVE_RUNNER == "true"'
    - when: never
  before_script: []
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-native.ps1 -Repository "$CI_PROJECT_DIR"

package:
  stage: package
  needs:
    - job: verify
    - job: windows-installer-runtime
    - job: windows-native-acceptance
      optional: true
    - job: release-readiness
      optional: true
  tags: [macos]
  script:
    - VERSION="${CI_COMMIT_TAG:-}"; VERSION="${VERSION#v}"; test -n "$VERSION" || VERSION="0.1.0-${CI_COMMIT_SHORT_SHA}"
    - sh scripts/check-package-runner.sh
    - AIGW_GITLAB_RELEASE_HOST="$CI_SERVER_URL" AIGW_GITLAB_RELEASE_PROJECT="$CI_PROJECT_PATH" AIGW_GITHUB_RELEASE_HOST="${AIGW_GITHUB_RELEASE_HOST:-https://github.com}" AIGW_GITHUB_RELEASE_PROJECT="${AIGW_GITHUB_RELEASE_PROJECT:-}" AIGW_REQUIRE_FULL_MATRIX=1 sh scripts/package.sh "$VERSION" dist
    - sh scripts/test-release-package-layout.sh dist "$VERSION"
  artifacts:
    expire_in: 30 days
    paths: [dist/]

release-readiness:
  stage: verify
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(rc|beta|alpha)\./'
    - when: never
  script:
    - sh scripts/check-release-readiness.sh "${CI_COMMIT_TAG#v}"

publish:
  stage: publish
  needs:
    - job: package
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      for file in dist/*; do
        name=$(basename "$file")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aigw/$VERSION/$name"
      done

release:
  stage: release
  needs: [publish]
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - sh scripts/publish-release.sh
