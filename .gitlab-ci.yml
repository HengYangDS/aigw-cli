native-windows:
  after_script:
    - |-
      $jobDirectory = Join-Path (Split-Path -Parent $env:CI_PROJECT_DIR) "aigw-ci-mise-$env:CI_JOB_ID"
      for ($attempt = 0; $attempt -lt 3 -and (Test-Path -LiteralPath $jobDirectory); $attempt++) {
        Remove-Item -LiteralPath $jobDirectory -Recurse -Force -ErrorAction SilentlyContinue
        if (Test-Path -LiteralPath $jobDirectory) { Start-Sleep -Milliseconds 500 }
      }
      if (Test-Path -LiteralPath $jobDirectory) { throw 'Mise job directory remains after cleanup.' }
  script:
    - . ./tools/ci/bootstrap/mise-windows.ps1 -Version '2026.9.16' -Sha256 '8e021ea855f50880ee4c8515f483b2cd07b27edb6109a8b4364ff09af65136b5' -Directory (Join-Path (Split-Path -Parent $env:CI_PROJECT_DIR) "aigw-ci-mise-$env:CI_JOB_ID") -MirrorResource 'packages/generic/mise-github/v1/' -ReleaseMetadataPattern 'regex:^https://api[.]github[.]com/repos/([^/]+)/([^/]+)/releases/tags/([^/?]+)$' -ReleaseMetadataResource 'release-$1-$2-$3.json'
    - cmd /c "set GODEBUG=http2client=0&&mise install --locked"
    - mise run bootstrap
    - if ($env:AIGW_REFRESH_LOCKS -eq 'true') { mise run dependencies:resolve }
    - mise exec --locked -- go run ./tools/ci native --platform windows --full-quality="$($env:AIGW_FULL_NATIVE_QUALITY -eq 'true')"
  tags:
    - ci-windows-arm64-shell
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
    - if: (($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($AIGW_NATIVE_PLATFORM == null || $AIGW_NATIVE_PLATFORM == "" || $AIGW_NATIVE_PLATFORM == "all" || $AIGW_NATIVE_PLATFORM == "windows")) && $CI_COMMIT_REF_PROTECTED == "true"
    - when: never
  stage: verify
  variables:
    AIGW_VERIFY_SYSTEM_KEYRING: "1"
    MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:anchore/syft,gh,glab
  artifacts:
    when: always
    paths:
      - mise.lock
      - .mise/locks
