native-darwin:
  script:
    - env GODEBUG=http2client=0 mise install --locked
    - mise run bootstrap
    - if [ "${AIGW_REFRESH_LOCKS:-false}" = true ]; then mise run dependencies:resolve; fi
    - mise exec --locked -- go run ./tools/ci native --platform darwin --full-quality="${AIGW_FULL_NATIVE_QUALITY:-false}"
  stage: verify
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,go:github.com/google/osv-scanner/v2/cmd/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:anchore/syft,gh,glab,github:lycheeverse/lychee,github:indygreg/apple-platform-rs
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($AIGW_NATIVE_PLATFORM == null || $AIGW_NATIVE_PLATFORM == "" || $AIGW_NATIVE_PLATFORM == "all" || $AIGW_NATIVE_PLATFORM == "darwin")
    - when: never
  artifacts:
    when: always
    paths:
      - mise.lock
      - .mise/locks
native-linux:
  extends:
    - .linux-toolchain
  stage: verify
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    CGO_ENABLED: "1"
    MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,go:github.com/google/osv-scanner/v2/cmd/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:anchore/syft,gh,glab,github:lycheeverse/lychee
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($AIGW_NATIVE_PLATFORM == null || $AIGW_NATIVE_PLATFORM == "" || $AIGW_NATIVE_PLATFORM == "all" || $AIGW_NATIVE_PLATFORM == "linux")
    - when: never
  artifacts:
    when: always
    paths:
      - mise.lock
      - .mise/locks
  script:
    - mise run bootstrap
    - if [ "${AIGW_REFRESH_LOCKS:-false}" = true ]; then mise run dependencies:resolve; fi
    - mise exec --locked -- go run ./tools/ci native --platform linux --full-quality="${AIGW_FULL_NATIVE_QUALITY:-false}"
    - |-
      DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y dbus-x11 gnome-keyring libglib2.0-bin
      dbus-run-session -- bash -euo pipefail <<'AIGW_SECRET_SERVICE'
      gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets --method org.freedesktop.Secret.Service.ReadAlias session | grep -Fq /org/freedesktop/secrets/collection/session
      gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets --method org.freedesktop.Secret.Service.SetAlias default /org/freedesktop/secrets/collection/session >/dev/null
      result=$(AIGW_VERIFY_SYSTEM_KEYRING=1 mise exec --locked -- go test ./tools/release -run "^TestNativeProductJourney/system_credential_store$" -count=1 -v 2>&1) || {
        printf '%s\n' "$result"
        exit 1
      }
      printf '%s\n' "$result"
      grep -Fq -- "--- PASS: TestNativeProductJourney/system_credential_store" <<<"$result"
      AIGW_SECRET_SERVICE
native-windows:
  script:
    - cmd /c "set GODEBUG=http2client=0&&mise install --locked"
    - mise run bootstrap
    - if ($env:AIGW_REFRESH_LOCKS -eq 'true') { mise run dependencies:resolve }
    - mise exec --locked -- go run ./tools/ci native --platform windows --full-quality="$($env:AIGW_FULL_NATIVE_QUALITY -eq 'true')"
  stage: verify
  tags:
    - $AIGW_GITLAB_WINDOWS_RUNNER_TAG
  variables:
    AIGW_VERIFY_SYSTEM_KEYRING: "1"
    MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,go:github.com/google/osv-scanner/v2/cmd/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:anchore/syft,gh,glab
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($AIGW_NATIVE_PLATFORM == null || $AIGW_NATIVE_PLATFORM == "" || $AIGW_NATIVE_PLATFORM == "all" || $AIGW_NATIVE_PLATFORM == "windows")
    - when: never
  artifacts:
    when: always
    paths:
      - mise.lock
      - .mise/locks
variables:
  GIT_DEPTH: "0"
  GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - when: never
stages:
  - verify
  - release
.linux-toolchain:
  image: ghcr.io/jdx/mise:2026.9.11-debian@sha256:12f3fe18fe6c02c54d1bbb9bdc60a492a72a320252439f0df657c6f01a04c23f
  variables:
    MISE_DATA_DIR: $CI_PROJECT_DIR/build/runtime/tool-cache/.mise
    MISE_CACHE_DIR: $CI_PROJECT_DIR/build/runtime/tool-cache/.mise/cache
  cache:
    key:
      files:
        - mise.toml
        - mise.lock
      prefix: mise-linux-12f3fe18fe6c02c54d1bbb9bdc60a492a72a320252439f0df657c6f01a04c23f-build-runtime-tool-cache-.mise-installs-cache-$CI_RUNNER_ID-$CI_JOB_NAME
    paths:
      - build/runtime/tool-cache/.mise/installs/
      - build/runtime/tool-cache/.mise/cache/
    policy: pull-push
    when: always
  before_script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y gcc libatomic1 libc6-dev openssh-client procps
    - env GODEBUG=http2client=0 mise install --locked
quality:
  script:
    - env GODEBUG=http2client=0 mise install --locked
    - mise run bootstrap
    - export AIGW_RELEASE_ALLOWED_SIGNERS_FILE="$AIGW_RELEASE_ALLOWED_SIGNERS"
    - mise exec --locked -- go run ./tools/ci quality
  stage: verify
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    CGO_ENABLED: "1"
    MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,go:github.com/google/osv-scanner/v2/cmd/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:lycheeverse/lychee
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        AIGW_COMMIT_BASE: $CI_COMMIT_SHA^
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
      variables:
        AIGW_COMMIT_BASE: $CI_MERGE_REQUEST_DIFF_BASE_SHA
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"
      variables:
        AIGW_COMMIT_BASE: $CI_COMMIT_BEFORE_SHA
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - when: never
accepted-ref-parity:
  script:
    - env GODEBUG=http2client=0 mise install --locked
    - mise exec --locked -- go run ./tools/forge refs --remote origin --expect "main=$CI_COMMIT_SHA" --expect "dev=$CI_COMMIT_SHA"
  stage: verify
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - when: never
release-version:
  script:
    - env GODEBUG=http2client=0 mise install --locked
    - mise exec --locked -- go run ./tools/release validate-version-tag
  stage: verify
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
release-assets:
  script:
    - env GODEBUG=http2client=0 mise install --locked
    - mkdir dist
    - mise exec --locked -- glab release download "$CI_COMMIT_TAG" --repo "$CI_PROJECT_URL" --asset-name 'aigw_*' --asset-name 'checksums.txt*' --dir dist
    - mise exec --locked -- go run ./tools/release verify-artifacts dist
  stage: release
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    AIGW_RELEASE_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ALLOWED_SIGNERS
    AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS
    SSH_ASKPASS_REQUIRE: never
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    MISE_ENABLE_TOOLS: go,glab
  rules:
    - if: $CI_COMMIT_TAG && ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web")
    - when: never
  needs:
    - job: quality
    - job: native-darwin
    - job: native-linux
    - job: native-windows
    - job: release-version
