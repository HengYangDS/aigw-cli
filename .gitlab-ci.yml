native-linux:
  interruptible: true
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_CI_LINUX_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main") && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($AIGW_NATIVE_PLATFORM == null || $AIGW_NATIVE_PLATFORM == "" || $AIGW_NATIVE_PLATFORM == "all" || $AIGW_NATIVE_PLATFORM == "linux")
    - when: never
  stage: verify
  variables:
    CGO_ENABLED: "1"
    GLAB_NO_PROMPT: "1"
    MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,github:sharkdp/hyperfine,shellcheck,taplo,typos,github:lycheeverse/lychee,github:anchore/syft,gh,glab
  artifacts:
    when: always
    paths:
      - mise.lock
      - .mise/locks
      - build/verification
  before_script:
    - |-
      set -eu
      timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      DEBIAN_FRONTEND=noninteractive timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y libatomic1 openssh-client procps time
    - |-
      set -eu
      DEBIAN_FRONTEND=noninteractive timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y gcc libc6-dev dbus-x11 gnome-keyring libglib2.0-bin
    - |-
      set -eu
      case "${AIGW_TOOL_SOURCE:-upstream}" in
        upstream) ;;
        peer)
      : "${CI_API_V4_URL:?}"
      : "${CI_PROJECT_ID:?}"
      : "${CI_SERVER_HOST:?}"
      : "${CI_JOB_ID:?}"
      : "${CI_JOB_TOKEN:?}"
      mirror_dir="$(pwd -P)/build/tmp/.aigw-mise-mirror-$CI_JOB_ID"
      mkdir -p -m 700 "$mirror_dir"
      if command -v sha256sum >/dev/null 2>&1; then
        lock_digest="$(sha256sum mise.lock)"
      else
        lock_digest="$(shasum -a 256 mise.lock)"
      fi
      lock_digest="${lock_digest%% *}"
      export MISE_DATA_DIR="$mirror_dir/mise-data"
      export MISE_CACHE_DIR="$MISE_DATA_DIR/cache"
      (umask 077; printf 'machine %s login gitlab-ci-token password %s\n' "$CI_SERVER_HOST" "$CI_JOB_TOKEN" > "$mirror_dir/netrc")
      export MISE_NETRC_FILE="$mirror_dir/netrc"
      export MISE_NETRC=1
      mirror_base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mise-github/$lock_digest/"
      export MISE_URL_REPLACEMENTS="$(printf '{"regex:^https://api[.]github[.]com/repos/([^/]+)/([^/]+)/releases/tags/([^/?]+)$":"%srelease-$1-$2-$3.json","https://github.com/":"%s","https://api.github.com/":"%s"}' "$mirror_base" "$mirror_base" "$mirror_base")"
          ;;
        *) printf '%s\n' 'AIGW_TOOL_SOURCE must be upstream or peer' >&2; exit 1 ;;
      esac
    - if [ -n "${AIGW_CANDIDATE_ARTIFACTS:-}${AIGW_CANDIDATE_TAG:-}" ] && [ "${AIGW_FULL_NATIVE_QUALITY:-false}" != true ] && [ "${AIGW_REFRESH_LOCKS:-false}" != true ]; then export MISE_ENABLE_TOOLS='go,gh,glab,github:goreleaser/goreleaser'; if [ "${AIGW_NATIVE_PERFORMANCE:-false}" = true ]; then export MISE_ENABLE_TOOLS="$MISE_ENABLE_TOOLS,github:sharkdp/hyperfine"; fi; fi
    - env GODEBUG=http2client=0 mise install --locked
  script:
    - if ! { [ -n "${AIGW_CANDIDATE_ARTIFACTS:-}${AIGW_CANDIDATE_TAG:-}" ] && [ "${AIGW_FULL_NATIVE_QUALITY:-false}" != true ] && [ "${AIGW_REFRESH_LOCKS:-false}" != true ]; }; then mise run bootstrap; fi
    - if [ "${AIGW_REFRESH_LOCKS:-false}" = true ]; then mise run dependencies:resolve; fi
    - |-
      if { [ -n "${AIGW_NATIVE_DIAGNOSTIC_CLIENT:-}" ] || [ "${AIGW_NATIVE_PERFORMANCE:-false}" = true ] || [ "${AIGW_NATIVE_PERFORMANCE_ATTRIBUTION:-false}" = true ]; } && [ "${CI_PIPELINE_SOURCE:-}" != web ] && [ "${CI_PIPELINE_SOURCE:-}" != api ]; then
        printf '%s\n' 'Native diagnostics and performance require a manual pipeline' >&2
        exit 1
      fi
      set -eu
      set -- --peer gitlab --repository "$CI_PROJECT_URL"
      if [ -n "${AIGW_BASELINE_TAG:-}" ]; then set -- "$@" --baseline-tag "$AIGW_BASELINE_TAG"; fi
      if [ -n "${AIGW_BASELINE_ARTIFACTS:-}" ]; then set -- "$@" --baseline-artifacts "$AIGW_BASELINE_ARTIFACTS"; fi
      if [ -n "${AIGW_CANDIDATE_TAG:-}" ]; then set -- "$@" --tag "$AIGW_CANDIDATE_TAG"; fi
      if [ -n "${AIGW_CANDIDATE_ARTIFACTS:-}" ]; then set -- "$@" --artifacts "$AIGW_CANDIDATE_ARTIFACTS" --candidate; fi
      if [ -n "${AIGW_CANDIDATE_SOURCE:-}" ]; then set -- "$@" --candidate-source "$AIGW_CANDIDATE_SOURCE"; fi
      if [ "${AIGW_NATIVE_PERFORMANCE:-false}" = true ]; then set -- "$@" --performance "$CI_PROJECT_DIR/build/verification/performance"; fi
      if [ "${AIGW_NATIVE_PERFORMANCE_ATTRIBUTION:-false}" = true ]; then set -- "$@" --performance-attribution; fi
      if [ -n "${AIGW_NATIVE_DIAGNOSTIC_CLIENT:-}" ]; then
        set -- "$@" --diagnostic-client "$AIGW_NATIVE_DIAGNOSTIC_CLIENT"
      elif [ "${AIGW_NATIVE_CLIENTS:-false}" = true ]; then
        : "${AIGW_BASELINE_TAG:?Real-client succession requires AIGW_BASELINE_TAG}"
        set -- "$@" --clients
      fi
      export AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE="${AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE:-${AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS:-}}"
      export AIGW_RELEASE_ALLOWED_SIGNERS_FILE="${AIGW_RELEASE_ALLOWED_SIGNERS_FILE:-${AIGW_RELEASE_ALLOWED_SIGNERS:-}}"
      mise exec --locked -- go run ./tools/ci native --platform linux --full-quality="${AIGW_FULL_NATIVE_QUALITY:-false}" -- "$@"
    - |-
      set -eu
      if [ -n "${CI_JOB_ID:-}" ]; then
        mirror_dir="$(pwd -P)/build/tmp/.aigw-mise-mirror-$CI_JOB_ID"
        rm -rf -- "$mirror_dir"
        if [ -e "$mirror_dir" ] || [ -L "$mirror_dir" ]; then
          printf '%s\n' 'Mise job-owned supply state remains after cleanup.' >&2
          exit 1
        fi
        printf '%s\n' 'Mise job-owned supply state retired.'
      fi
