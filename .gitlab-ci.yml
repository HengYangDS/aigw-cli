variables:
  GIT_DEPTH: "0"
  GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: $CI_COMMIT_TAG
      auto_cancel:
        on_new_commit: none
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main") && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
      auto_cancel:
        on_new_commit: none
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      auto_cancel:
        on_new_commit: none
    - when: never
stages:
  - verify
  - release
.linux-toolchain:
  image: docker.io/jdxcode/mise:2026.9.16-debian@sha256:686fe914b791c761637be4a13494d45d2b92b3c3979e46ea61b1ca51df472de6
  variables:
    MISE_DATA_DIR: $CI_PROJECT_DIR/build/runtime/tool-cache/.mise
    MISE_CACHE_DIR: $CI_PROJECT_DIR/build/runtime/tool-cache/.mise/cache
  cache:
    key:
      files:
        - mise.toml
        - mise.lock
      prefix: mise-linux-686fe914b791c761637be4a13494d45d2b92b3c3979e46ea61b1ca51df472de6-build-runtime-tool-cache-.mise-installs-cache-$CI_RUNNER_ID-$CI_JOB_NAME
    paths:
      - build/runtime/tool-cache/.mise/installs/
      - build/runtime/tool-cache/.mise/cache/
    policy: pull-push
    when: always
  before_script:
    - timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && DEBIAN_FRONTEND=noninteractive timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y gcc libatomic1 libc6-dev openssh-client procps
    - |-
      set -eu
      : "${CI_API_V4_URL:?}"
      : "${CI_PROJECT_ID:?}"
      : "${CI_SERVER_HOST:?}"
      : "${CI_JOB_ID:?}"
      : "${CI_JOB_TOKEN:?}"
      : "${CI_PROJECT_DIR:?}"
      mirror_dir="$CI_PROJECT_DIR/build/tmp/aigw-mise-mirror-$CI_JOB_ID"
      mkdir -p -m 700 "$mirror_dir"
      (umask 077; printf 'machine %s login gitlab-ci-token password %s\n' "$CI_SERVER_HOST" "$CI_JOB_TOKEN" > "$mirror_dir/netrc")
      export MISE_NETRC_FILE="$mirror_dir/netrc"
      export MISE_NETRC=1
      mirror_base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mise-github/v1/"
      export MISE_URL_REPLACEMENTS="$(printf '{"regex:^https://api[.]github[.]com/repos/([^/]+)/([^/]+)/releases/tags/([^/?]+)$":"%srelease-$1-$2-$3.json","https://github.com/":"%s","https://api.github.com/":"%s"}' "$mirror_base" "$mirror_base" "$mirror_base")"
    - env GODEBUG=http2client=0 mise install --locked
  after_script:
    - if [ -n "${CI_PROJECT_DIR:-}" ] && [ -n "${CI_JOB_ID:-}" ]; then rm -rf -- "$CI_PROJECT_DIR/build/tmp/aigw-mise-mirror-$CI_JOB_ID"; fi
quality:
  interruptible: true
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  script:
    - mise run bootstrap
    - export AIGW_RELEASE_ALLOWED_SIGNERS_FILE="$AIGW_RELEASE_ALLOWED_SIGNERS"
    - mise exec --locked -- go run ./tools/ci quality
  stage: verify
  variables:
    CGO_ENABLED: "1"
    MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:lycheeverse/lychee
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        AIGW_COMMIT_BASE: $CI_COMMIT_SHA^
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main") && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
      variables:
        AIGW_COMMIT_BASE: $CI_MERGE_REQUEST_DIFF_BASE_SHA
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
      variables:
        AIGW_COMMIT_BASE: $CI_COMMIT_BEFORE_SHA
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      variables:
        AIGW_COMMIT_BASE: $CI_COMMIT_SHA^
    - when: never
accepted-ref-parity:
  script:
    - |-
      set -eu
      : "${CI_API_V4_URL:?}"
      : "${CI_PROJECT_ID:?}"
      : "${CI_SERVER_HOST:?}"
      : "${CI_JOB_ID:?}"
      : "${CI_JOB_TOKEN:?}"
      : "${CI_PROJECT_DIR:?}"
      mirror_dir="$CI_PROJECT_DIR/build/tmp/aigw-mise-mirror-$CI_JOB_ID"
      mkdir -p -m 700 "$mirror_dir"
      (umask 077; printf 'machine %s login gitlab-ci-token password %s\n' "$CI_SERVER_HOST" "$CI_JOB_TOKEN" > "$mirror_dir/netrc")
      export MISE_NETRC_FILE="$mirror_dir/netrc"
      export MISE_NETRC=1
      mirror_base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mise-github/v1/"
      export MISE_URL_REPLACEMENTS="$(printf '{"regex:^https://api[.]github[.]com/repos/([^/]+)/([^/]+)/releases/tags/([^/?]+)$":"%srelease-$1-$2-$3.json","https://github.com/":"%s","https://api.github.com/":"%s"}' "$mirror_base" "$mirror_base" "$mirror_base")"
    - env GODEBUG=http2client=0 mise install --locked
    - mise exec --locked -- go run ./tools/forge refs --remote origin --expect "main=$CI_COMMIT_SHA" --expect "dev=$CI_COMMIT_SHA"
  after_script:
    - if [ -n "${CI_PROJECT_DIR:-}" ] && [ -n "${CI_JOB_ID:-}" ]; then rm -rf -- "$CI_PROJECT_DIR/build/tmp/aigw-mise-mirror-$CI_JOB_ID"; fi
  stage: verify
  tags:
    - ci-macos-arm64-shell
  variables:
    MISE_ENABLE_TOOLS: go
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - when: never
linux-secret-service:
  interruptible: true
  extends:
    - .linux-toolchain
  stage: verify
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,github:goreleaser/goreleaser
    CGO_ENABLED: "1"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main") && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($AIGW_NATIVE_PLATFORM == null || $AIGW_NATIVE_PLATFORM == "" || $AIGW_NATIVE_PLATFORM == "all" || $AIGW_NATIVE_PLATFORM == "linux")
    - when: never
  script:
    - |-
      DEBIAN_FRONTEND=noninteractive timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y dbus-x11 gnome-keyring libglib2.0-bin
      dbus-run-session -- bash -euo pipefail <<'AIGW_SECRET_SERVICE'
      gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets --method org.freedesktop.Secret.Service.ReadAlias session | grep -Fq /org/freedesktop/secrets/collection/session
      gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets --method org.freedesktop.Secret.Service.SetAlias default /org/freedesktop/secrets/collection/session >/dev/null
      result=$(AIGW_VERIFY_SYSTEM_KEYRING=1 mise exec --locked -- go test ./tools/release -run "^TestNativeProductJourney/system_credential_store$" -count=1 -v 2>&1) || {
        printf '%s\n' "$result"
        exit 1
      }
      printf '%s\n' "$result"
      grep -Fq -- "--- PASS: TestNativeProductJourney/system_credential_store" <<<"$result"
      AIGW_SECRET_SERVICE
release-version:
  script:
    - |-
      set -eu
      : "${CI_API_V4_URL:?}"
      : "${CI_PROJECT_ID:?}"
      : "${CI_SERVER_HOST:?}"
      : "${CI_JOB_ID:?}"
