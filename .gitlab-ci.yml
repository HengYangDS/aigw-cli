variables:
  MISE_CONFIG_DIR: $CI_PROJECT_DIR/.config/ci
  MISE_GLOBAL_CONFIG_FILE: $CI_PROJECT_DIR/.config/ci/config.toml
  MISE_SYSTEM_CONFIG_DIR: $CI_PROJECT_DIR/.config/ci
  GIT_DEPTH: "0"
  GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - when: never
stages:
  - verify
  - package
  - publish
  - release
.linux-toolchain:
  image:
    name: ghcr.io/jdx/mise:2026.9.5@sha256:d549958171c177f113e62ddba5afdfb9e245d699ac457148e4b7b0da7af3b0b7
    entrypoint:
      - ""
  variables:
    MISE_DATA_DIR: $CI_PROJECT_DIR/build/runtime/tool-cache/.mise
    MISE_CACHE_DIR: $CI_PROJECT_DIR/build/runtime/tool-cache/.mise/cache
  cache:
    key:
      files:
        - mise.toml
        - mise.lock
      prefix: mise-linux-d549958171c177f113e62ddba5afdfb9e245d699ac457148e4b7b0da7af3b0b7-build-runtime-tool-cache-.mise-installs-cache-$CI_RUNNER_ID-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG
    paths:
      - build/runtime/tool-cache/.mise/installs/
      - build/runtime/tool-cache/.mise/cache/
    policy: pull-push
    when: always
  before_script:
    - mise install --locked
quality:
  stage: verify
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,node,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,go:github.com/google/osv-scanner/v2/cmd/osv-scanner,github:lycheeverse/lychee,github:rhysd/actionlint,taplo
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        AIGW_COMMIT_BASE: $CI_COMMIT_SHA^
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
      variables:
        AIGW_COMMIT_BASE: $CI_MERGE_REQUEST_DIFF_BASE_SHA
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
      variables:
        AIGW_COMMIT_BASE: $CI_COMMIT_BEFORE_SHA
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - when: never
  script:
    - mise run bootstrap
    - export AIGW_RELEASE_ALLOWED_SIGNERS_FILE="$AIGW_RELEASE_ALLOWED_SIGNERS"
    - mise exec --locked -- go run ./tools/ci quality
accepted-ref-parity:
  stage: verify
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - when: never
  script:
    - mise install --locked
    - mise exec --locked -- go run ./tools/forge refs --remote origin --expect "main=$CI_COMMIT_SHA" --expect "dev=$CI_COMMIT_SHA"
native-darwin:
  script:
    - mise install --locked
    - mise run bootstrap
    - if [ "${AIGW_REFRESH_LOCKS:-false}" = true ]; then mise run dependencies:resolve; fi
    - mise exec --locked -- go run ./tools/ci native --platform darwin
  stage: verify
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,node,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,go:github.com/google/osv-scanner/v2/cmd/osv-scanner,github:lycheeverse/lychee,github:rhysd/actionlint,taplo,glab,github:anchore/syft
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - when: never
  artifacts:
    when: always
    paths:
      - mise.lock
native-linux:
  extends:
    - .linux-toolchain
  script:
    - mise run bootstrap
    - if [ "${AIGW_REFRESH_LOCKS:-false}" = true ]; then mise run dependencies:resolve; fi
    - mise exec --locked -- go run ./tools/ci native --platform linux
  stage: verify
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,node,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,go:github.com/google/osv-scanner/v2/cmd/osv-scanner,github:lycheeverse/lychee,github:rhysd/actionlint,taplo,glab,github:anchore/syft
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - when: never
  artifacts:
    when: always
    paths:
      - mise.lock
release-readiness:
  stage: verify
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - mise exec --locked -- go run ./tools/release validate-readiness-tag
package:
  stage: package
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    AIGW_RELEASE_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ALLOWED_SIGNERS
    AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS
    SSH_ASKPASS_REQUIRE: never
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: quality
    - job: native-darwin
    - job: native-linux
    - job: release-readiness
  script:
    - test -s "$AIGW_RELEASE_ALLOWED_SIGNERS_FILE" && test -s "$AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE" && test -n "$AIGW_RELEASE_ARTIFACT_SIGNER"
    - ssh-keygen -y -P '' -f "$AIGW_RELEASE_SIGNING_KEY" >/dev/null
    - mise exec --locked -- go run ./tools/release build-ci build/release dist
  artifacts:
    expire_in: 30 days
    paths:
      - dist/
publish:
  stage: publish
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    AIGW_RELEASE_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ALLOWED_SIGNERS
    AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS
    SSH_ASKPASS_REQUIRE: never
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: package
      artifacts: true
  script:
    - mise exec --locked -- go run ./tools/release upload-gitlab dist
release:
  stage: release
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    AIGW_RELEASE_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ALLOWED_SIGNERS
    AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS
    SSH_ASKPASS_REQUIRE: never
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: publish
    - job: package
      artifacts: true
  script:
    - mise exec --locked -- go run ./tools/release publish-gitlab dist
