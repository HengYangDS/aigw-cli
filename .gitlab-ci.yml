workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\// && !$CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//
      when: never
    - when: always
stages:
  - verify
  - package
  - publish
  - release
variables:
  GIT_DEPTH: "0"
  GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
source-and-governance:
  stage: verify
  image:
    name: ghcr.io/jdx/mise@sha256:92dbc3f2573926d8974e4641ad8449f16c323130b9f41c39aff19b7b2f500ef6
    entrypoint:
      - ""
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    AIGW_FORGE_PROVIDER: gitlab
  script:
    - |-
      version=$(awk '$1 == "min_version" {gsub(/"/, "", $3); print $3}' mise.toml)
      test -n "$version"
      installer=$(mktemp)
      trap 'rm -f "$installer"' EXIT HUP INT TERM
      curl --fail --silent --show-error --location \
        "https://github.com/jdx/mise/releases/download/v${version}/install.sh" \
        --output "$installer"
      MISE_VERSION="$version" MISE_INSTALL_PATH=/usr/local/bin/mise sh "$installer"
      mise --version
    - export AIGW_RELEASE_ALLOWED_SIGNERS_FILE="$AIGW_RELEASE_ALLOWED_SIGNERS"
    - mise exec --locked -- go run ./tools/ci source
native-darwin:
  stage: verify
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,cue
  script:
    - mise install --locked
    - mise exec --locked -- go run ./tools/ci native --platform darwin
native-linux:
  stage: verify
  image:
    name: ghcr.io/jdx/mise@sha256:92dbc3f2573926d8974e4641ad8449f16c323130b9f41c39aff19b7b2f500ef6
    entrypoint:
      - ""
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,cue
  script:
    - |-
      version=$(awk '$1 == "min_version" {gsub(/"/, "", $3); print $3}' mise.toml)
      test -n "$version"
      installer=$(mktemp)
      trap 'rm -f "$installer"' EXIT HUP INT TERM
      curl --fail --silent --show-error --location \
        "https://github.com/jdx/mise/releases/download/v${version}/install.sh" \
        --output "$installer"
      MISE_VERSION="$version" MISE_INSTALL_PATH=/usr/local/bin/mise sh "$installer"
      mise --version
    - mise exec --locked -- go run ./tools/ci native --platform linux
native-windows:
  stage: verify
  tags:
    - $AIGW_GITLAB_WINDOWS_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,cue
  script:
    - mise install --locked
    - mise exec --locked -- go run ./tools/ci native --platform windows
release-readiness:
  stage: verify
  image:
    name: ghcr.io/jdx/mise@sha256:92dbc3f2573926d8974e4641ad8449f16c323130b9f41c39aff19b7b2f500ef6
    entrypoint:
      - ""
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(rc|beta|alpha)\./
    - when: never
  script:
    - |-
      version=$(awk '$1 == "min_version" {gsub(/"/, "", $3); print $3}' mise.toml)
      test -n "$version"
      installer=$(mktemp)
      trap 'rm -f "$installer"' EXIT HUP INT TERM
      curl --fail --silent --show-error --location \
        "https://github.com/jdx/mise/releases/download/v${version}/install.sh" \
        --output "$installer"
      MISE_VERSION="$version" MISE_INSTALL_PATH=/usr/local/bin/mise sh "$installer"
      mise --version
    - mise exec --locked -- go run ./tools/release validate-readiness-tag
package:
  stage: package
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: source-and-governance
    - job: native-darwin
    - job: native-linux
    - job: native-windows
    - job: release-readiness
      optional: true
  script:
    - mise exec --locked -- go run ./tools/release build-ci build/release dist
  artifacts:
    expire_in: 30 days
    paths:
      - dist/
publish:
  stage: publish
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: package
      artifacts: true
  script:
    - mise exec --locked -- go run ./tools/release upload-gitlab dist
release:
  stage: release
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: publish
    - job: package
      artifacts: true
  script:
    - mise exec --locked -- go run ./tools/release publish-gitlab dist
