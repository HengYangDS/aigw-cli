      install -m 0755 "$tmpdir/mise/bin/mise" /usr/local/bin/mise
      mise --version
    - mise exec --locked -- go run ./tools/release validate-readiness-tag
package:
  stage: package
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: source-and-governance
    - job: native-darwin
    - job: native-linux
    - job: native-windows
    - job: release-readiness
      optional: true
  script:
    - mise exec --locked -- go run ./tools/release build-ci build/release dist
  artifacts:
    expire_in: 30 days
    paths:
      - dist/
publish:
  stage: publish
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: package
      artifacts: true
  script:
    - mise exec --locked -- go run ./tools/release upload-gitlab dist
release:
  stage: release
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: publish
    - job: package
      artifacts: true
  script:
    - mise exec --locked -- go run ./tools/release publish-gitlab dist
