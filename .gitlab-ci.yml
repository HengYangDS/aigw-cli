workflow:
  rules:
    # Release headings are valid only after their signed tag exists. Suppress the
    # transient untagged release/* pipeline; the tag is the sole release proof.
    - if: '$CI_COMMIT_BRANCH =~ /^release\// && !$CI_COMMIT_TAG'
      when: never
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//'
      when: never
    - when: always

stages: [verify, package, acceptance, publish, release]

default:
  image: golang:1.25.12
  tags: [aigw-release-macos-arm64]
  before_script:
    # A pipe, rather than a comma, means Go may advance after a transient
    # proxy failure such as a TLS handshake timeout. Keep GitLab's dependency
    # path self-contained; GitHub Actions deliberately uses its own defaults.
    - export GOPROXY="${AIGW_GOPROXY:-https://goproxy.cn|https://proxy.golang.org|direct}"; . scripts/prepare-ci-go-cache.sh

variables:
  # Release chronology and branch-closeout proof need complete ancestry. Keep
  # this in source so a project-level shallow-clone setting cannot regress it.
  GIT_DEPTH: "0"
  GOTOOLCHAIN: go1.25.12

verify:
  stage: verify
  script:
    - sh scripts/check-release-toolchain.sh
    - go run ./tools/coveragegate --race
    - go vet ./...
    - sh scripts/check-static-analysis.sh
    - test -z "$(gofmt -l cmd internal tools)"
    - for script in scripts/*.sh; do sh -n "$script"; done
    - sh scripts/check-package-safety.sh
    - sh scripts/check-product-surface.sh
    - sh scripts/check-retired-residue.sh
    - sh scripts/check-english-text.sh
    - sh scripts/check-credential-literals.sh
    - sh scripts/test-credential-literals.sh
    - sh scripts/check-credential-fixtures.sh
    - sh scripts/test-credential-fixtures.sh
    # Fetch GitLab provenance tags without pruning unrelated local namespaces.
    # Canonical workstations retain GitHub provenance below refs/tags/github/.
    - git fetch --tags --force origin
    - sh scripts/check-commit-provenance.sh . gitlab
    - 'if test -n "${CI_COMMIT_TAG:-}"; then sh scripts/check-release-tag-signature.sh . "$CI_COMMIT_TAG" gitlab; fi'
    - sh scripts/check-governance.sh
    - python3 scripts/check-markdown-presentation.py
    - python3 scripts/check-text-layout.py
    - sh scripts/test-text-layout.sh
    - sh scripts/test-changelog.sh
    - sh scripts/test-tag-namespace.sh
    - sh scripts/test-release-readiness.sh
    - sh scripts/test-release-artifacts.sh
    - sh scripts/test-publish-release.sh
    - sh scripts/test-release-source-date-epoch.sh
    - sh scripts/test-release-forge-sources.sh
    - sh scripts/test-release-toolchain.sh
    - sh scripts/test-verified-candidate.sh
    - sh scripts/test-publish-github-release.sh
    - sh scripts/test-release-tag-signature.sh
    - sh scripts/test-release-tag-signature-provider-selection.sh
    - sh scripts/test-package-runner-preflight.sh
    - sh scripts/test-linux-native-install-staging.sh
    - sh scripts/test-macos-native-install-staging.sh
    - sh scripts/test-msi-version.sh
    - sh scripts/test-pipeline-gates.sh
    - sh scripts/test-ci-go-proxy-policy.sh
    - sh scripts/test-ci-go-cache-preparation.sh
    - sh scripts/test-github-actions-contract.sh
    - sh scripts/test-github-release-workflow.sh
    - sh scripts/test-github-provider-projection.sh
    - sh scripts/test-commit-provenance.sh
    - sh scripts/test-branch-closeout.sh
    - sh scripts/test-forge-sync.sh
    - go build -o /tmp/aigw-install-smoke ./cmd/aigw
    - sh scripts/test-installers.sh /tmp/aigw-install-smoke
    - sh scripts/test-portable-install.sh /tmp/aigw-install-smoke

windows-installer-runtime:
  stage: verify
  tags: [aigw-release-macos-arm64]
  before_script: []
  script:
    - command -v pwsh
    - pwsh -NoProfile -NonInteractive -File scripts/test-installers.ps1 -Installer "$CI_PROJECT_DIR/scripts/install.ps1"

windows-native-acceptance:
  stage: verify
  tags: [windows]
  before_script: []
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-native.ps1 -Repository "$CI_PROJECT_DIR"

macos-native-acceptance:
  stage: acceptance
  tags: [aigw-release-macos-arm64]
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script: []
  needs:
    - job: package
      artifacts: true
  script:
    - 'test -n "${AIGW_MACOS_ACCEPTANCE_USER:-}"'
    - 'test -n "${AIGW_MACOS_UPGRADE_PACKAGE:-}"'
    - 'sudo -n sh scripts/test-macos-native-install.sh dist "${CI_COMMIT_TAG#v}"'

package:
  stage: package
  needs:
    - job: verify
    - job: windows-installer-runtime
    - job: windows-native-acceptance
    - job: release-readiness
      optional: true
  tags: [aigw-release-macos-arm64]
  script:
    - VERSION="${CI_COMMIT_TAG:-}"; VERSION="${VERSION#v}"; test -n "$VERSION" || VERSION="0.1.0-${CI_COMMIT_SHORT_SHA}"
    - sh scripts/check-release-toolchain.sh
    - sh scripts/check-package-runner.sh
    - |
      set -eu
      SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
      if test -n "${CI_COMMIT_TAG:-}"; then
        SOURCE_DATE_EPOCH="$(sh scripts/release-source-date-epoch.sh "$VERSION")"
      fi
      export SOURCE_DATE_EPOCH
      sh scripts/test-release-reproducibility.sh "$VERSION"
      AIGW_REQUIRE_FULL_MATRIX=1 sh scripts/package.sh "$VERSION" dist
    - sh scripts/test-release-package-layout.sh dist "$VERSION"
  artifacts:
    expire_in: 30 days
    paths: [dist/]

release-readiness:
  stage: verify
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(rc|beta|alpha)\./'
    - when: never
  script:
    - sh scripts/check-release-readiness.sh "${CI_COMMIT_TAG#v}"

publish:
  stage: publish
  needs:
    - job: package
      artifacts: true
    - job: macos-native-acceptance
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      for file in dist/*; do
        name=$(basename "$file")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aigw/$VERSION/$name"
      done

release:
  stage: release
  needs:
    - job: publish
    - job: package
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - sh scripts/publish-release.sh dist
