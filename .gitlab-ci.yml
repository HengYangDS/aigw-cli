stages: [verify, package, publish, release]

default:
  image: golang:1.25
  cache:
    key: go-mod
    paths: [.cache/go-build, .cache/go-mod]
  before_script:
    - export GOPROXY="${AIGW_GOPROXY:-https://goproxy.cn,direct}" GOCACHE="$CI_PROJECT_DIR/.cache/go-build" GOMODCACHE="$CI_PROJECT_DIR/.cache/go-mod"

verify:
  stage: verify
  script:
    - go test -race ./...
    - go vet ./...
    - test -z "$(gofmt -l cmd internal tools)"
    - for script in scripts/*.sh; do sh -n "$script"; done
    - sh scripts/check-package-safety.sh
    - sh scripts/check-retired-residue.sh
    - sh scripts/test-release-readiness.sh
    - sh scripts/test-release-artifacts.sh
    - sh scripts/test-package-runner-preflight.sh
    - sh scripts/test-linux-native-install-staging.sh
    - sh scripts/test-msi-version.sh
    - sh scripts/test-pipeline-gates.sh
    - go build -o /tmp/aigw-install-smoke ./cmd/aigw
    - sh scripts/test-installers.sh /tmp/aigw-install-smoke
    - sh scripts/test-portable-install.sh /tmp/aigw-install-smoke
    - '! grep -RInE --exclude-dir=.git --exclude="*_test.go" "(sk-[A-Za-z0-9_-]{24,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9_-]{24,})" .'

windows-installer-runtime:
  stage: verify
  # The release runner is macOS because it builds the Universal pkg. Requiring
  # PowerShell there makes the Windows installer executable test fail closed,
  # instead of silently reducing it to static inspection.
  tags: [macos]
  before_script: []
  script:
    - command -v pwsh
    - pwsh -NoProfile -NonInteractive -File scripts/test-installers.ps1 -Installer "$CI_PROJECT_DIR/scripts/install.ps1"

package:
  stage: package
  needs:
    - job: verify
    - job: windows-installer-runtime
    - job: release-readiness
      optional: true
  # Native macOS packaging requires pkgbuild/productbuild. This shell runner
  # also produces the Linux and Windows artifacts through nFPM and wixl; a
  # generic Linux Docker runner must never publish a partial matrix.
  tags: [macos]
  script:
    - VERSION="${CI_COMMIT_TAG#v}"; test -n "$VERSION" || VERSION="0.1.0-${CI_COMMIT_SHORT_SHA}"
    - sh scripts/check-package-runner.sh
    - AIGW_REQUIRE_FULL_MATRIX=1 sh scripts/package.sh "$VERSION" dist
    - sh scripts/test-release-package-layout.sh dist "$VERSION"
  artifacts:
    expire_in: 30 days
    paths: [dist/]

release-readiness:
  stage: verify
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(rc|beta|alpha)\./'
    - when: never
  script:
    - sh scripts/check-release-readiness.sh "${CI_COMMIT_TAG#v}"

publish:
  stage: publish
  needs:
    - job: package
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      for file in dist/*; do
        name=$(basename "$file")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aigw/$VERSION/$name"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [publish]
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aigw/$VERSION"
    - |
      release-cli create --tag-name "$CI_COMMIT_TAG" --name "AIGW $CI_COMMIT_TAG" \
        --description "Cross-platform AIGW CLI release. Verify downloads with checksums.txt." \
        --assets-link "{\"name\":\"macOS Universal pkg\",\"url\":\"$BASE/aigw_${VERSION}_darwin_universal.pkg\",\"direct_asset_path\":\"/aigw_${VERSION}_darwin_universal.pkg\"}" \
        --assets-link "{\"name\":\"macOS amd64 portable\",\"url\":\"$BASE/aigw_${VERSION}_darwin_amd64.tar.gz\",\"direct_asset_path\":\"/aigw_${VERSION}_darwin_amd64.tar.gz\"}" \
        --assets-link "{\"name\":\"macOS arm64 portable\",\"url\":\"$BASE/aigw_${VERSION}_darwin_arm64.tar.gz\",\"direct_asset_path\":\"/aigw_${VERSION}_darwin_arm64.tar.gz\"}" \
        --assets-link "{\"name\":\"Linux amd64 deb\",\"url\":\"$BASE/aigw_${VERSION}_linux_amd64.deb\",\"direct_asset_path\":\"/aigw_${VERSION}_linux_amd64.deb\"}" \
        --assets-link "{\"name\":\"Linux arm64 deb\",\"url\":\"$BASE/aigw_${VERSION}_linux_arm64.deb\",\"direct_asset_path\":\"/aigw_${VERSION}_linux_arm64.deb\"}" \
        --assets-link "{\"name\":\"Linux amd64 rpm\",\"url\":\"$BASE/aigw_${VERSION}_linux_amd64.rpm\",\"direct_asset_path\":\"/aigw_${VERSION}_linux_amd64.rpm\"}" \
        --assets-link "{\"name\":\"Linux arm64 rpm\",\"url\":\"$BASE/aigw_${VERSION}_linux_arm64.rpm\",\"direct_asset_path\":\"/aigw_${VERSION}_linux_arm64.rpm\"}" \
        --assets-link "{\"name\":\"Linux amd64 portable\",\"url\":\"$BASE/aigw_${VERSION}_linux_amd64.tar.gz\",\"direct_asset_path\":\"/aigw_${VERSION}_linux_amd64.tar.gz\"}" \
        --assets-link "{\"name\":\"Linux arm64 portable\",\"url\":\"$BASE/aigw_${VERSION}_linux_arm64.tar.gz\",\"direct_asset_path\":\"/aigw_${VERSION}_linux_arm64.tar.gz\"}" \
        --assets-link "{\"name\":\"Windows amd64 msi\",\"url\":\"$BASE/aigw_${VERSION}_windows_amd64.msi\",\"direct_asset_path\":\"/aigw_${VERSION}_windows_amd64.msi\"}" \
        --assets-link "{\"name\":\"Windows arm64 msi\",\"url\":\"$BASE/aigw_${VERSION}_windows_arm64.msi\",\"direct_asset_path\":\"/aigw_${VERSION}_windows_arm64.msi\"}" \
        --assets-link "{\"name\":\"Windows amd64 portable\",\"url\":\"$BASE/aigw_${VERSION}_windows_amd64.zip\",\"direct_asset_path\":\"/aigw_${VERSION}_windows_amd64.zip\"}" \
        --assets-link "{\"name\":\"Windows arm64 portable\",\"url\":\"$BASE/aigw_${VERSION}_windows_arm64.zip\",\"direct_asset_path\":\"/aigw_${VERSION}_windows_arm64.zip\"}" \
        --assets-link "{\"name\":\"SHA-256 checksums\",\"url\":\"$BASE/checksums.txt\",\"direct_asset_path\":\"/checksums.txt\"}" \
        --assets-link "{\"name\":\"SPDX SBOM\",\"url\":\"$BASE/aigw_${VERSION}.spdx.json\",\"direct_asset_path\":\"/aigw_${VERSION}.spdx.json\"}"
