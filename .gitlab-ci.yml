variables:
  GIT_DEPTH: "0"
  GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
  MISE_GLOBAL_CONFIG_FILE: $CI_PROJECT_DIR/.config/ci/empty-mise-global.toml
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\// && !$CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//
      when: never
    - when: always
stages:
  - verify
  - package
  - publish
  - release
.linux-toolchain:
  image:
    name: ghcr.io/jdx/mise@sha256:f2d637d5e5189f7ec177b73bce5cd5db7e7b17a4f466f887c1b88ac2dd431129
    entrypoint:
      - ""
.source-toolchain:
  image:
    name: ghcr.io/jdx/mise@sha256:f2d637d5e5189f7ec177b73bce5cd5db7e7b17a4f466f887c1b88ac2dd431129
    entrypoint:
      - ""
  before_script:
    - |-
      lock_sha=$(sha256sum mise.lock | awk '{print $1}')
      authenticated_api="$CI_SERVER_PROTOCOL://gitlab-ci-token:$CI_JOB_TOKEN@$CI_SERVER_HOST:$CI_SERVER_PORT/api/v4"
      mirror="$authenticated_api/projects/$CI_PROJECT_ID/packages/generic/ci-source-tools/$lock_sha/\$4"
      export MISE_URL_REPLACEMENTS="{\"regex:^https://github\\\\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/(.+)\$\":\"$mirror\"}"
    - mise install --locked
source-and-governance:
  stage: verify
  extends:
    - .source-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,node,cue,npm:@fission-ai/openspec,github:gitleaks/gitleaks,github:rhysd/actionlint,github:lycheeverse/lychee
  script:
    - export AIGW_RELEASE_ALLOWED_SIGNERS_FILE="$AIGW_RELEASE_ALLOWED_SIGNERS"
    - mise exec --locked -- go run ./tools/ci source
native-darwin:
  script:
    - mise install --locked
    - mise exec --locked -- go run ./tools/ci native --platform darwin
  stage: verify
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,cue
native-linux:
  extends:
    - .linux-toolchain
  script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dbus-x11 gnome-keyring
    - dbus-run-session -- sh -c 'printf \"\\n\" | gnome-keyring-daemon --unlock >/dev/null; export AIGW_VERIFY_SYSTEM_KEYRING=1; mise exec --locked -- go run ./tools/ci native --platform linux'
  stage: verify
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,cue
release-readiness:
  stage: verify
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(rc|beta|alpha)\./
    - when: never
  script:
    - mise exec --locked -- go run ./tools/release validate-readiness-tag
package:
  stage: package
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: source-and-governance
    - job: native-darwin
    - job: native-linux
    - job: release-readiness
      optional: true
  script:
    - mise exec --locked -- go run ./tools/release build-ci build/release dist
  artifacts:
    expire_in: 30 days
    paths:
      - dist/
publish:
  stage: publish
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: package
      artifacts: true
  script:
    - mise exec --locked -- go run ./tools/release upload-gitlab dist
release:
  stage: release
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: publish
    - job: package
      artifacts: true
  script:
    - mise exec --locked -- go run ./tools/release publish-gitlab dist
