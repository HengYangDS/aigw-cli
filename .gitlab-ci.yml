variables:
  GIT_DEPTH: "0"
  GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - when: never
stages:
  - verify
  - release
.linux-toolchain:
  image: ghcr.io/jdx/mise:2026.9.11-debian@sha256:12f3fe18fe6c02c54d1bbb9bdc60a492a72a320252439f0df657c6f01a04c23f
  variables:
    MISE_DATA_DIR: $CI_PROJECT_DIR/build/runtime/tool-cache/.mise
    MISE_CACHE_DIR: $CI_PROJECT_DIR/build/runtime/tool-cache/.mise/cache
  cache:
    key:
      files:
        - mise.toml
        - mise.lock
      prefix: mise-linux-12f3fe18fe6c02c54d1bbb9bdc60a492a72a320252439f0df657c6f01a04c23f-build-runtime-tool-cache-.mise-installs-cache-$CI_RUNNER_ID-$CI_JOB_NAME
    paths:
      - build/runtime/tool-cache/.mise/installs/
      - build/runtime/tool-cache/.mise/cache/
    policy: pull-push
    when: always
  before_script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y gcc libatomic1 libc6-dev openssh-client procps
    - env GODEBUG=http2client=0 mise install --locked
quality:
  stage: verify
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    CGO_ENABLED: "1"
    MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,go:github.com/google/osv-scanner/v2/cmd/osv-scanner,github:lycheeverse/lychee,github:rhysd/actionlint,shellcheck,taplo,typos
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        AIGW_COMMIT_BASE: $CI_COMMIT_SHA^
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
      variables:
        AIGW_COMMIT_BASE: $CI_MERGE_REQUEST_DIFF_BASE_SHA
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
      variables:
        AIGW_COMMIT_BASE: $CI_COMMIT_BEFORE_SHA
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - when: never
  script:
    - mise run bootstrap
    - export AIGW_RELEASE_ALLOWED_SIGNERS_FILE="$AIGW_RELEASE_ALLOWED_SIGNERS"
    - mise exec --locked -- go run ./tools/ci quality
accepted-ref-parity:
  stage: verify
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - when: never
  script:
    - mise exec --locked -- go run ./tools/forge refs --remote origin --expect "main=$CI_COMMIT_SHA" --expect "dev=$CI_COMMIT_SHA"
native-darwin:
  script:
    - env GODEBUG=http2client=0 mise install --locked
    - mise run bootstrap
    - if [ "${AIGW_REFRESH_LOCKS:-false}" = true ]; then mise run dependencies:resolve; fi
    - mise exec --locked -- go run ./tools/ci native --platform darwin --full-quality="${AIGW_FULL_NATIVE_QUALITY:-false}"
  stage: verify
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,go:github.com/google/osv-scanner/v2/cmd/osv-scanner,github:lycheeverse/lychee,github:rhysd/actionlint,shellcheck,taplo,typos,gh,glab,github:anchore/syft,github:indygreg/apple-platform-rs
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($AIGW_NATIVE_PLATFORM == null || $AIGW_NATIVE_PLATFORM == "" || $AIGW_NATIVE_PLATFORM == "all" || $AIGW_NATIVE_PLATFORM == "darwin")
    - when: never
  artifacts:
    when: always
    paths:
      - mise.lock
      - .mise/locks
native-linux:
  extends:
    - .linux-toolchain
  stage: verify
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    CGO_ENABLED: "1"
    MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,go:github.com/google/osv-scanner/v2/cmd/osv-scanner,github:lycheeverse/lychee,github:rhysd/actionlint,shellcheck,taplo,typos,gh,glab,github:anchore/syft,github:indygreg/apple-platform-rs
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($AIGW_NATIVE_PLATFORM == null || $AIGW_NATIVE_PLATFORM == "" || $AIGW_NATIVE_PLATFORM == "all" || $AIGW_NATIVE_PLATFORM == "linux")
    - when: never
  artifacts:
    when: always
    paths:
      - mise.lock
      - .mise/locks
  script:
    - mise run bootstrap
    - if [ "${AIGW_REFRESH_LOCKS:-false}" = true ]; then mise run dependencies:resolve; fi
    - mise exec --locked -- go run ./tools/ci native --platform linux --full-quality="${AIGW_FULL_NATIVE_QUALITY:-false}"
release-version:
  stage: verify
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - mise exec --locked -- go run ./tools/release validate-version-tag
release-assets:
  stage: release
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    AIGW_RELEASE_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ALLOWED_SIGNERS
    AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE: $AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS
    SSH_ASKPASS_REQUIRE: never
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    MISE_ENABLE_TOOLS: go,glab
  rules:
    - if: $CI_COMMIT_TAG && ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web")
    - when: never
  needs:
    - job: quality
    - job: native-darwin
    - job: native-linux
    - job: release-version
  script:
    - mkdir dist
    - mise exec --locked -- glab release download "$CI_COMMIT_TAG" --repo "$CI_PROJECT_URL" --asset-name 'aigw_*' --asset-name 'checksums.txt*' --dir dist
    - mise exec --locked -- go run ./tools/release verify-artifacts dist
