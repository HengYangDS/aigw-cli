workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\// && !$CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//
      when: never
    - when: always
stages:
  - verify
  - package
  - publish
  - release
variables:
  GIT_DEPTH: "0"
  GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
source-and-governance:
  stage: verify
  image:
    name: ghcr.io/jdx/mise@sha256:92dbc3f2573926d8974e4641ad8449f16c323130b9f41c39aff19b7b2f500ef6
    entrypoint:
      - ""
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    AIGW_FORGE_PROVIDER: gitlab
  script:
    - |-
      version=$(awk '$1 == "min_version" {gsub(/"/, "", $3); print $3}' mise.toml)
      test -n "$version"
      case "$(uname -m)" in
        x86_64|amd64) arch=x64 ;;
        aarch64|arm64) arch=arm64 ;;
        *) echo "unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      asset="mise-v${version}-linux-${arch}.tar.gz"
      release_url="https://github.com/jdx/mise/releases/download/v${version}"
      tmpdir=$(mktemp -d)
      trap 'rm -rf "$tmpdir"' EXIT HUP INT TERM
      curl --fail --silent --show-error --location --http1.1 \
        --connect-timeout 10 --max-time 120 \
        --retry 4 --retry-delay 2 --retry-all-errors \
        "$release_url/$asset" --output "$tmpdir/$asset"
      curl --fail --silent --show-error --location --http1.1 \
        --connect-timeout 10 --max-time 120 \
        --retry 4 --retry-delay 2 --retry-all-errors \
        "$release_url/SHASUMS256.txt" --output "$tmpdir/SHASUMS256.txt"
      (
        cd "$tmpdir"
        sed -n "s#  \./$asset$#  $asset#p" SHASUMS256.txt > "$asset.sha256"
        test -s "$asset.sha256"
        sha256sum --check "$asset.sha256"
        tar --extract --gzip --file "$asset"
      )
      install -m 0755 "$tmpdir/mise/bin/mise" /usr/local/bin/mise
      mise --version
    - export AIGW_RELEASE_ALLOWED_SIGNERS_FILE="$AIGW_RELEASE_ALLOWED_SIGNERS"
    - mise exec --locked -- go run ./tools/ci source
native-darwin:
  stage: verify
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,cue
  script:
    - mise install --locked
    - mise exec --locked -- go run ./tools/ci native --platform darwin
