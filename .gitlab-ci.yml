workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\// && !$CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//
      when: never
    - when: always
stages:
  - verify
  - package
  - publish
  - release
variables:
  GIT_DEPTH: "0"
  GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
.linux-toolchain:
  image:
    name: ghcr.io/jdx/mise@sha256:92dbc3f2573926d8974e4641ad8449f16c323130b9f41c39aff19b7b2f500ef6
    entrypoint:
      - ""
  before_script:
    - |-
      version=$(awk '$1 == "min_version" {gsub(/"/, "", $3); print $3}' mise.toml)
      test -n "$version"
      case "$(uname -m)" in
        x86_64|amd64)
          arch=x64
          checksum=cfe49784ec9683b38510846958cfecd9b59da84d4e8a38d18ffda19dc2941ead
          ;;
        aarch64|arm64)
          arch=arm64
          checksum=b92744ceb9a01f0bb198bfcf2ba49c36918c9e4353a34be50f23d5b6e93c28ee
          ;;
        *) echo "unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      asset="mise-linux-$arch.tar.gz"
      package_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ci-mise/$version/$asset"
      tmpdir=$(mktemp -d)
      trap 'rm -rf "$tmpdir"' EXIT HUP INT TERM
      curl --fail --silent --show-error --location \
        --connect-timeout 5 --max-time 120 \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$package_url" --output "$tmpdir/$asset"
      (
        cd "$tmpdir"
        printf '%s  %s\n' "$checksum" "$asset" | sha256sum --check --strict
        tar --extract --gzip --file "$asset"
      )
      install -m 0755 "$tmpdir/mise/bin/mise" /usr/local/bin/mise
      test "$(mise --version | awk '{print $1}')" = "$version"
source-and-governance:
  stage: verify
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    AIGW_FORGE_PROVIDER: gitlab
  script:
    - export AIGW_RELEASE_ALLOWED_SIGNERS_FILE="$AIGW_RELEASE_ALLOWED_SIGNERS"
    - mise exec --locked -- go run ./tools/ci source
native-darwin:
  stage: verify
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,cue
  script:
    - mise install --locked
    - mise exec --locked -- go run ./tools/ci native --platform darwin
native-linux:
  stage: verify
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,cue
  script:
    - mise exec --locked -- go run ./tools/ci native --platform linux
native-windows:
  stage: verify
  tags:
    - $AIGW_GITLAB_WINDOWS_RUNNER_TAG
  variables:
    MISE_ENABLE_TOOLS: go,cue
  script:
    - mise install --locked
    - mise exec --locked -- go run ./tools/ci native --platform windows
release-readiness:
  stage: verify
  extends:
    - .linux-toolchain
  tags:
    - $AIGW_GITLAB_LINUX_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(rc|beta|alpha)\./
    - when: never
  script:
    - mise exec --locked -- go run ./tools/release validate-readiness-tag
package:
  stage: package
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: source-and-governance
    - job: native-darwin
    - job: native-linux
    - job: native-windows
    - job: release-readiness
      optional: true
  script:
    - mise exec --locked -- go run ./tools/release build-ci build/release dist
  artifacts:
    expire_in: 30 days
    paths:
      - dist/
publish:
  stage: publish
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: package
      artifacts: true
  script:
    - mise exec --locked -- go run ./tools/release upload-gitlab dist
release:
  stage: release
  tags:
    - $AIGW_GITLAB_DARWIN_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  needs:
    - job: publish
    - job: package
      artifacts: true
  script:
    - mise exec --locked -- go run ./tools/release publish-gitlab dist
