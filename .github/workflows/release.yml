name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.25.12

jobs:
  native-linux:
    name: Native Linux release acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: "1.25.12"
          check-latest: false
          cache: false
      - name: Run native Linux release acceptance
        run: |
          set -euo pipefail
          sh scripts/check-commit-provenance.sh . github
          go run ./tools/coveragegate --race
          go vet ./...
          go build -o "$RUNNER_TEMP/aigw" ./cmd/aigw
          "$RUNNER_TEMP/aigw" --version

  native-windows:
    name: Native Windows release acceptance
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: "1.25.12"
          check-latest: false
          cache: false
      - name: Run native Windows release acceptance
        shell: pwsh
        run: ./scripts/test-windows-native.ps1 -Repository $env:GITHUB_WORKSPACE

  package-and-publish:
    name: Independently package and publish
    # Release credentials are confined to a runner that never executes
    # verification or merge-request workflow code.
    runs-on: [self-hosted, macOS, ARM64, aigw-github-release-macos-arm64]
    needs: [native-linux, native-windows]
    timeout-minutes: 45
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: "1.25.12"
          check-latest: false
          cache: false
      - name: Install release build tools
        run: |
          set -euo pipefail
          brew install nfpm msitools
          sh scripts/check-package-runner.sh
      - name: Verify the signed tag and source gates
        env:
          SELECTED_TAG: ${{ inputs.tag || github.ref_name }}
          AIGW_CHANGELOG_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$SELECTED_TAG" in v*) ;; *) echo "release requires a v* tag" >&2; exit 2 ;; esac
          test "$(git rev-parse "$SELECTED_TAG^{}")" = "$(git rev-parse HEAD)"
          sh scripts/check-release-tag-signature.sh . "$SELECTED_TAG" github
          sh scripts/check-commit-provenance.sh . github
          sh scripts/check-release-toolchain.sh
          go run ./tools/coveragegate --race
          go vet ./...
          sh scripts/check-static-analysis.sh
          test -z "$(gofmt -l cmd internal tools)"
          sh scripts/check-governance.sh
          python3 scripts/check-markdown-presentation.py
          python3 scripts/check-text-layout.py
          sh scripts/test-text-layout.sh
          sh scripts/test-changelog.sh
          sh scripts/test-release-artifacts.sh
          sh scripts/test-publish-release.sh
          sh scripts/test-publish-github-release.sh
          sh scripts/test-ci-go-cache-preparation.sh
          sh scripts/test-verified-candidate.sh
          sh scripts/test-pipeline-gates.sh
          sh scripts/test-macos-native-install-staging.sh
      - name: Build the complete release matrix
        env:
          SELECTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${SELECTED_TAG#v}"
          SOURCE_DATE_EPOCH="$(sh scripts/release-source-date-epoch.sh "$version")"
          export SOURCE_DATE_EPOCH
          sh scripts/test-release-reproducibility.sh "$version"
          AIGW_REQUIRE_FULL_MATRIX=1 sh scripts/package.sh "$version" dist
          sh scripts/test-release-package-layout.sh dist "$version"
      - name: Run PowerShell installer contract
        shell: pwsh
        run: ./scripts/test-installers.ps1 -Installer ./scripts/install.ps1
      - name: Publish or verify immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sh scripts/publish-github-release.sh dist
