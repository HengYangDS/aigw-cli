name: Release
env:
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: core.longpaths
  GIT_CONFIG_VALUE_1: "true"
  MISE_CONFIG_DIR: ${{ github.workspace }}/.config/mise/external
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.config/mise/external/config.toml
  MISE_SYSTEM_CONFIG_DIR: ${{ github.workspace }}/.config/mise/external
  MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise/external
"on":
  workflow_dispatch:
    inputs:
      tool_source:
        description: Locked upstream distribution or the selected peer's verified immutable tool copies
        required: false
        type: choice
        default: upstream
        options:
          - upstream
          - peer
      tag:
        description: Existing published v* release to verify
        required: true
        type: string
      runner:
        description: Native execution environment
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
          - windows-2025
          - windows-11-arm
      native_lifecycle:
        description: Run the existing native lifecycle against the published bytes
        type: boolean
        default: false
      baseline_tag:
        description: Published predecessor v* release that native_lifecycle upgrades from and rolls back to
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag }}-${{ inputs.runner }}
  cancel-in-progress: false
jobs:
  release-assets:
    name: Verify published release artifacts
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      MISE_ENABLE_TOOLS: ${{ inputs.native_lifecycle && (startsWith(inputs.runner, 'macos-') && 'go,gh,node,github:goreleaser/goreleaser,github:indygreg/apple-platform-rs' || 'go,gh,node,github:goreleaser/goreleaser') || 'go,gh' }}
      GH_TOKEN: ${{ github.token }}
      CI_COMMIT_TAG: ${{ inputs.tag }}
      AIGW_RELEASE_ARTIFACT_SIGNER: ${{ vars.AIGW_RELEASE_ARTIFACT_SIGNER }}
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: ${{ inputs.tool_source == 'peer' && format('{{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"{0}/{1}/releases/download/native-inputs-f3c7f87fc3b4df21782e954b71e4481072284db6/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"{0}/{1}/releases/download/native-inputs-f3c7f87fc3b4df21782e954b71e4481072284db6/$2"}}', github.server_url, github.repository) || '' }}
        with:
          version: 2026.10.22
          install: true
          install_args: --locked
          cache: ${{ inputs.tool_source != 'peer' }}
          cache_key_prefix: mise-${{ github.job }}
      - name: Validate release version
        run: mise exec --locked -- go run ./tools/release validate-version-tag
      - name: Materialize provenance trust input
        env:
          AIGW_RELEASE_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ALLOWED_SIGNERS }}
        run: mise exec --locked -- go run ./tools/ci trust-input --output "$env:RUNNER_TEMP/aigw-allowed-signers" --github-env "$env:GITHUB_ENV"
      - name: Materialize artifact signature trust
        env:
          AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS }}
        run: mise exec --locked -- go run ./tools/ci trust-input --artifact --output "$env:RUNNER_TEMP/aigw-artifact-signers" --github-env "$env:GITHUB_ENV"
      - name: Verify this peer's exact tag pipeline
        run: mise exec --locked -- go run ./tools/ci release-evidence --repository "$env:GITHUB_REPOSITORY" --workflow verify.yml --tag "$env:CI_COMMIT_TAG" --job 'Quality and governance' --job 'Native macOS acceptance' --job 'Native Linux acceptance' --job 'Native Windows acceptance' --job 'Linux Secret Service' --job 'Release version'
      - name: Download this peer's published artifacts
        run: mise exec --locked -- gh release download "$env:CI_COMMIT_TAG" --repo "$env:GITHUB_REPOSITORY" --dir build/artifacts/published
      - name: Verify complete artifacts and signed source
        run: mise exec --locked -- go run ./tools/release verify-artifacts build/artifacts/published
      - name: Verify published native lifecycle
        if: inputs.native_lifecycle
        env:
          AIGW_VERIFY_SYSTEM_KEYRING: ${{ runner.os == 'Windows' && '1' || '0' }}
          AIGW_SYSTEM_CREDENTIAL_TEST_SCOPE: ephemeral-host
          AIGW_BASELINE_TAG: ${{ inputs.baseline_tag }}
        run: mise exec --locked -- go run ./tools/release accept-native --artifacts build/artifacts/published --peer=github --repository="$env:GITHUB_REPOSITORY" --baseline-tag="$env:AIGW_BASELINE_TAG"
