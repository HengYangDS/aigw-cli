name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and governance gates
    # GitLab is the canonical merge-request gate. This trusted runner accepts
    # only repository-controlled main, tag, and manual workflow revisions.
    runs-on: ${{ fromJSON(vars.AIGW_VERIFY_RUNNER) }}
    timeout-minutes: 25
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up locked toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: false
          mise_dir: ${{ runner.temp }}/aigw-mise
      - name: Refresh annotated release tags
        run: mise exec --locked -- go run ./tools/ci fetch-tags
      - name: Materialize provenance trust input
        env:
          AIGW_RELEASE_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ALLOWED_SIGNERS }}
        run: mise exec --locked -- go run ./tools/ci trust-input --output "$RUNNER_TEMP/aigw-allowed-signers" --github-env "$GITHUB_ENV"
      - name: Verify pushed release tag provenance
        if: github.ref_type == 'tag'
        env:
          SELECTED_TAG: ${{ github.ref_name }}
        run: mise exec --locked -- go run ./tools/forge tag --provider github --tag "$SELECTED_TAG" --allowed-signers "$AIGW_GITHUB_ALLOWED_SIGNERS"
      - name: Run source and policy gates
        env:
          CGO_ENABLED: '1'
          AIGW_FORGE_PROVIDER: github
          AIGW_RELEASE_AUTHOR_EMAIL: ${{ vars.AIGW_RELEASE_AUTHOR_EMAIL }}
          AIGW_RELEASE_ALLOWED_SIGNERS_FILE: ${{ env.AIGW_GITHUB_ALLOWED_SIGNERS }}
          AIGW_CHANGELOG_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: mise exec --locked -- go run ./tools/ci source
  native-darwin:
    name: Native macOS acceptance
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up locked toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: false
      - name: Run native macOS acceptance
        run: mise exec --locked -- go run ./tools/ci native --platform darwin

  native-linux:
    name: Native Linux acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up locked toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: false
      - name: Materialize provenance trust input
        env:
          AIGW_RELEASE_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ALLOWED_SIGNERS }}
        run: mise exec --locked -- go run ./tools/ci trust-input --output "$RUNNER_TEMP/aigw-allowed-signers" --github-env "$GITHUB_ENV"
      - name: Run native Linux acceptance
        run: mise exec --locked -- go run ./tools/ci native --platform linux

  native-windows:
    name: Native Windows acceptance
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up locked toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: false
      - name: Run native Windows acceptance
        run: mise exec --locked -- go run ./tools/ci native --platform windows
      - name: Upload Windows coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-coverage
          path: build/acceptance/coverage-windows.out
          if-no-files-found: warn
