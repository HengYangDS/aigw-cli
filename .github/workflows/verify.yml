name: Verify
defaults:
  run:
    shell: bash
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
"on":
  push:
    branches:
      - dev
      - main
    tags:
      - v*
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      tool_source:
        description: Locked upstream distribution or the selected peer's verified immutable tool copies
        required: false
        type: choice
        default: upstream
        options:
          - upstream
          - peer
      native_platform:
        description: Native platform to qualify; partial runs do not establish full release readiness
        required: false
        type: choice
        default: all
        options:
          - all
          - darwin
          - linux
          - windows
      full_quality:
        description: Qualify all repository quality tools on each native platform
        required: false
        type: boolean
        default: false
      windows_clients:
        description: With baseline_tag, qualify real Windows clients through the existing release lifecycle
        required: false
        type: boolean
        default: false
      diagnostic_client:
        description: Diagnose one supplied native client with baseline/candidate inputs; not full acceptance
        required: false
        type: string
        default: ""
      macos_keychain:
        description: With baseline_tag, qualify only the published predecessor Keychain journey on disposable macOS
        required: false
        type: boolean
        default: false
      performance:
        description: Measure published candidate_tag against baseline_tag with retained native samples
        required: false
        type: boolean
        default: false
      refresh_locks:
        description: Verify two native mise lock refreshes without changing committed inputs
        required: false
        type: boolean
        default: false
      commit_base:
        description: Optional exclusive base; defaults to the selected commit's parent for manual diagnostics
        required: false
        type: string
      baseline_tag:
        description: Optional historical release tag for packaged upgrade and rollback acceptance
        required: false
        type: string
      candidate_tag:
        description: With baseline_tag, consume this published candidate without rebuilding
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: true
jobs:
  accepted-ref-parity:
    name: Accepted ref parity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref_name == 'main'
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: ${{ inputs.tool_source == 'peer' && format('{{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-v$1/$2"}}', github.server_url, github.repository) || '' }}
        with:
          version: 2026.10.1
          install: true
          install_args: --locked
          cache: ${{ inputs.tool_source != 'peer' }}
          cache_key_prefix: mise-${{ github.job }}
      - name: Verify main and dev name the same product object
        run: mise exec --locked -- go run ./tools/forge refs --remote origin --expect "main=${{ github.sha }}" --expect "dev=${{ github.sha }}"
  quality:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual Quality and governance' || 'Quality and governance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: (github.ref_type == 'tag' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))) && (github.event_name != 'workflow_dispatch' || github.ref_type == 'tag' || inputs.full_quality || inputs.refresh_locks || inputs.windows_clients || inputs.candidate_tag == '')
    env:
      MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:lycheeverse/lychee
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: ${{ inputs.tool_source == 'peer' && format('{{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-v$1/$2"}}', github.server_url, github.repository) || '' }}
        with:
          version: 2026.10.1
          install: true
          install_args: --locked
          cache: ${{ inputs.tool_source != 'peer' }}
          cache_key_prefix: mise-${{ github.job }}
      - name: Prepare locked dependencies
        run: mise run bootstrap
      - name: Materialize provenance trust input
        env:
          AIGW_RELEASE_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ALLOWED_SIGNERS }}
        run: mise exec --locked -- go run ./tools/ci trust-input --output "$RUNNER_TEMP/aigw-allowed-signers" --github-env "$GITHUB_ENV"
      - name: Verify pushed release tag provenance
        if: github.ref_type == 'tag'
        env:
          SELECTED_TAG: ${{ github.ref_name }}
        run: mise exec --locked -- go run ./tools/forge tag --tag "$SELECTED_TAG" --allowed-signers "$AIGW_RELEASE_ALLOWED_SIGNERS_FILE"
      - name: Run quality and governance
        env:
          CGO_ENABLED: "0"
          AIGW_COMMIT_BASE: ${{ github.event.pull_request.base.sha || (github.ref_type == 'tag' && format('{0}^', github.sha)) || github.event.before || inputs.commit_base || format('{0}^', github.sha) }}
          AIGW_RELEASE_AUTHOR_EMAIL: ${{ vars.AIGW_RELEASE_AUTHOR_EMAIL }}
          AIGW_RELEASE_ALLOWED_SIGNERS_FILE: ${{ env.AIGW_RELEASE_ALLOWED_SIGNERS_FILE }}
          AIGW_CHANGELOG_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: mise exec --locked -- go run ./tools/ci quality
      - name: Retain native dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-evidence-quality
          path: build/verification/dependencies
          if-no-files-found: ignore
      - name: Retain native source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-evidence-quality
          path: |-
            build/verification/workflows
            build/verification/coverage
          if-no-files-found: ignore
  linux-secret-service:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual Linux Secret Service' || 'Linux Secret Service' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: (github.ref_type == 'tag' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))) && (github.event_name != 'workflow_dispatch' || github.ref_type == 'tag' || inputs.native_platform == '' || inputs.native_platform == 'all' || inputs.native_platform == 'linux')
    env:
      MISE_ENABLE_TOOLS: go,github:goreleaser/goreleaser
      CGO_ENABLED: "0"
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: ${{ inputs.tool_source == 'peer' && format('{{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-v$1/$2"}}', github.server_url, github.repository) || '' }}
        with:
          version: 2026.10.1
          install: true
          install_args: --locked
          cache: ${{ inputs.tool_source != 'peer' }}
          cache_key_prefix: mise-${{ github.job }}
      - name: Qualify Linux Secret Service
        run: |-
          sudo -n timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo -n DEBIAN_FRONTEND=noninteractive timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y dbus-x11 gnome-keyring libglib2.0-bin
          G_DEBUG=fatal-warnings dbus-run-session -- bash -euo pipefail <<'AIGW_SECRET_SERVICE'
          gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets --method org.freedesktop.Secret.Service.ReadAlias session | grep -Fq /org/freedesktop/secrets/collection/session
          gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets --method org.freedesktop.Secret.Service.SetAlias default /org/freedesktop/secrets/collection/session >/dev/null
          AIGW_VERIFY_SYSTEM_KEYRING=1 mise exec --locked -- go test ./internal/secrets/native -run "^TestSecretServiceRotationPreservesExistingItem$" -count=1 -v
          AIGW_VERIFY_SYSTEM_KEYRING=1 mise exec --locked -- go test ./tools/release -run "^TestNativeProductJourney/system_credential_store$" -count=1 -v
          AIGW_SECRET_SERVICE
  release-version:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual Release version' || 'Release version' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.ref_type == 'tag'
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: ${{ inputs.tool_source == 'peer' && format('{{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-v$1/$2"}}', github.server_url, github.repository) || '' }}
        with:
          version: 2026.10.1
          install: true
          install_args: --locked
          cache: ${{ inputs.tool_source != 'peer' }}
          cache_key_prefix: mise-${{ github.job }}
      - name: Validate tag version
        run: mise exec --locked -- go run ./tools/release validate-version-tag
  native-darwin:
    defaults:
      run:
        shell: bash
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual Native macOS acceptance' || 'Native macOS acceptance' }}
    runs-on: macos-26-intel
    timeout-minutes: 25
    if: (github.ref_type == 'tag' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))) && (github.event_name != 'workflow_dispatch' || github.ref_type == 'tag' || inputs.native_platform == '' || inputs.native_platform == 'all' || inputs.native_platform == 'darwin')
    env:
      MISE_ENABLE_TOOLS: ${{ (!(github.event_name != 'workflow_dispatch' || inputs.full_quality || inputs.refresh_locks || inputs.windows_clients || inputs.candidate_tag == '')) && 'go,gh,glab,github:goreleaser/goreleaser,github:indygreg/apple-platform-rs' || 'go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:lycheeverse/lychee,github:anchore/syft,gh,glab,github:indygreg/apple-platform-rs' }}
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: ${{ inputs.tool_source == 'peer' && format('{{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-v$1/$2"}}', github.server_url, github.repository) || '' }}
        with:
          version: 2026.10.1
          install: true
          install_args: --locked
          cache: ${{ inputs.tool_source != 'peer' }}
          cache_key_prefix: mise-${{ github.job }}
      - name: Prepare locked dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.full_quality || inputs.refresh_locks || inputs.windows_clients || inputs.candidate_tag == ''
        run: mise run bootstrap
      - name: Verify native lock resolution
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_locks
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise run dependencies:resolve
      - name: Retain native lock observation
        if: always() && github.event_name == 'workflow_dispatch' && inputs.refresh_locks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mise-lock-darwin
          path: |
            mise.lock
            .mise/locks
          include-hidden-files: true
      - env:
          AIGW_SYSTEM_CREDENTIAL_TEST_SCOPE: ephemeral-host
        name: Run native macOS acceptance
        if: github.event_name != 'workflow_dispatch' || (!inputs.full_quality && inputs.baseline_tag == '' && inputs.candidate_tag == '')
        run: mise exec --locked -- go run ./tools/ci native --platform darwin
      - env:
          AIGW_SYSTEM_CREDENTIAL_TEST_SCOPE: ephemeral-host
          CGO_ENABLED: "1"
        name: Qualify all repository tools on macOS
        if: github.event_name == 'workflow_dispatch' && inputs.full_quality
        run: mise exec --locked -- go run ./tools/ci native --platform darwin --full-quality
      - name: Prepare native source trust
        if: github.event_name == 'workflow_dispatch' && (inputs.baseline_tag != '' || inputs.candidate_tag != '' || inputs.windows_clients || inputs.diagnostic_client != '' || inputs.macos_keychain || inputs.performance)
        env:
          AIGW_RELEASE_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ALLOWED_SIGNERS }}
          AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS }}
        run: mise exec --locked -- go run ./tools/ci trust-input --output "$RUNNER_TEMP/aigw-native-source-signers" --github-env "$GITHUB_ENV"
      - name: Prepare native artifact trust
        if: github.event_name == 'workflow_dispatch' && (inputs.baseline_tag != '' || inputs.candidate_tag != '' || inputs.windows_clients || inputs.diagnostic_client != '' || inputs.macos_keychain || inputs.performance)
        env:
          AIGW_RELEASE_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ALLOWED_SIGNERS }}
          AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS }}
        run: mise exec --locked -- go run ./tools/ci trust-input --artifact --output "$RUNNER_TEMP/aigw-native-artifact-signers" --github-env "$GITHUB_ENV"
      - name: Run historical release acceptance
        if: github.event_name == 'workflow_dispatch' && (inputs.baseline_tag != '' || inputs.candidate_tag != '' || inputs.windows_clients || inputs.diagnostic_client != '' || inputs.macos_keychain || inputs.performance) && !inputs.performance
        env:
          AIGW_SYSTEM_CREDENTIAL_TEST_SCOPE: ephemeral-host
          AIGW_VERIFY_SYSTEM_KEYRING: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_keychain && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          AIGW_BASELINE_TAG: ${{ inputs.baseline_tag }}
          AIGW_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          AIGW_NATIVE_DIAGNOSTIC_CLIENT: ${{ inputs.diagnostic_client }}
          AIGW_RELEASE_ARTIFACT_SIGNER: ${{ vars.AIGW_RELEASE_ARTIFACT_SIGNER }}
        run: mise exec --locked -- go run ./tools/release accept-native --peer=github --repository="$GITHUB_REPOSITORY" --baseline-tag="$AIGW_BASELINE_TAG" --tag="$AIGW_CANDIDATE_TAG" --clients=false --diagnostic-client="$AIGW_NATIVE_DIAGNOSTIC_CLIENT"
      - name: Measure historical release performance
        if: github.event_name == 'workflow_dispatch' && (inputs.baseline_tag != '' || inputs.candidate_tag != '' || inputs.windows_clients || inputs.diagnostic_client != '' || inputs.macos_keychain || inputs.performance) && inputs.performance
        env:
          AIGW_SYSTEM_CREDENTIAL_TEST_SCOPE: ephemeral-host
          AIGW_VERIFY_SYSTEM_KEYRING: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_keychain && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          AIGW_BASELINE_TAG: ${{ inputs.baseline_tag }}
          AIGW_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          AIGW_NATIVE_DIAGNOSTIC_CLIENT: ${{ inputs.diagnostic_client }}
          AIGW_RELEASE_ARTIFACT_SIGNER: ${{ vars.AIGW_RELEASE_ARTIFACT_SIGNER }}
          MISE_ENABLE_TOOLS: ${{ env.MISE_ENABLE_TOOLS }},github:sharkdp/hyperfine
        run: mise run performance --peer=github --repository="$GITHUB_REPOSITORY" --baseline-tag="$AIGW_BASELINE_TAG" --tag="$AIGW_CANDIDATE_TAG" --clients=false --diagnostic-client="$AIGW_NATIVE_DIAGNOSTIC_CLIENT" --performance "$GITHUB_WORKSPACE/build/performance"
      - name: Retain native dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-evidence-darwin
          path: build/verification/dependencies
          if-no-files-found: ignore
      - name: Retain native source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-evidence-darwin
          path: |-
            build/verification/workflows
            build/verification/coverage
          if-no-files-found: ignore
      - name: Retain native performance samples
        if: always() && github.event_name == 'workflow_dispatch' && inputs.performance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-darwin
          path: build/performance
          if-no-files-found: error
  native-linux:
    defaults:
      run:
        shell: bash
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual Native Linux acceptance' || 'Native Linux acceptance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: (github.ref_type == 'tag' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))) && (github.event_name != 'workflow_dispatch' || github.ref_type == 'tag' || inputs.native_platform == '' || inputs.native_platform == 'all' || inputs.native_platform == 'linux')
    env:
      MISE_ENABLE_TOOLS: ${{ (!(github.event_name != 'workflow_dispatch' || inputs.full_quality || inputs.refresh_locks || inputs.windows_clients || inputs.candidate_tag == '')) && 'go,gh,glab,github:goreleaser/goreleaser' || 'go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:lycheeverse/lychee,github:anchore/syft,gh,glab' }}
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: ${{ inputs.tool_source == 'peer' && format('{{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"{0}/{1}/releases/download/mise-glab-v$1/$2"}}', github.server_url, github.repository) || '' }}
        with:
          version: 2026.10.1
          install: true
          install_args: --locked
          cache: ${{ inputs.tool_source != 'peer' }}
          cache_key_prefix: mise-${{ github.job }}
      - name: Prepare locked dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.full_quality || inputs.refresh_locks || inputs.windows_clients || inputs.candidate_tag == ''
        run: mise run bootstrap
      - name: Prepare native memory measurement
        if: github.event_name == 'workflow_dispatch' && inputs.performance
        run: |-
          set -eu
          sudo -n timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo -n DEBIAN_FRONTEND=noninteractive timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y time
      - name: Verify native lock resolution
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_locks
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise run dependencies:resolve
      - name: Retain native lock observation
        if: always() && github.event_name == 'workflow_dispatch' && inputs.refresh_locks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mise-lock-linux
          path: |
            mise.lock
            .mise/locks
          include-hidden-files: true
      - name: Run native Linux acceptance
        if: github.event_name != 'workflow_dispatch' || (!inputs.full_quality && inputs.baseline_tag == '' && inputs.candidate_tag == '')
        run: mise exec --locked -- go run ./tools/ci native --platform linux
      - env:
          CGO_ENABLED: "1"
        name: Qualify all repository tools on Linux
