          MISE_ENABLE_TOOLS: ${{ env.MISE_ENABLE_TOOLS }},github:sharkdp/hyperfine
        run: mise run performance --peer=github --repository="$GITHUB_REPOSITORY" --baseline-tag="$AIGW_BASELINE_TAG" --tag="$AIGW_CANDIDATE_TAG" --clients=false --diagnostic-client="$AIGW_NATIVE_DIAGNOSTIC_CLIENT" --performance "$GITHUB_WORKSPACE/build/performance"
      - name: Retain native dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
