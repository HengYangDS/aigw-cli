name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and governance gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run source and policy gates
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l cmd internal tools)"
          for script in scripts/*.sh; do sh -n "$script"; done
          sh scripts/check-package-safety.sh
          sh scripts/check-retired-residue.sh
          sh scripts/check-governance.sh
          python3 scripts/check-markdown-presentation.py
          sh scripts/test-changelog.sh
          sh scripts/test-release-readiness.sh
          sh scripts/test-release-artifacts.sh
          sh scripts/test-release-tag-signature.sh
          sh scripts/test-package-runner-preflight.sh
          sh scripts/test-linux-native-install-staging.sh
          sh scripts/test-msi-version.sh
          sh scripts/test-publish-release.sh
          sh scripts/test-publish-github-release.sh
          sh scripts/test-pipeline-gates.sh
          sh scripts/test-github-actions-contract.sh

  package:
    name: Release artifact matrix
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout exact signed tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install deterministic packaging tools
        run: |
          set -euo pipefail
          brew install nfpm msitools libarchive
      - name: Verify signed tag and build full matrix
        env:
          AIGW_RELEASE_PROVIDER: github
          AIGW_RELEASE_HOST: https://github.com
          AIGW_RELEASE_PROJECT: ${{ github.repository }}
          AIGW_RELEASE_MIRROR_PROVIDER: gitlab
          AIGW_RELEASE_MIRROR_HOST: ${{ vars.AIGW_GITLAB_RELEASE_HOST }}
          AIGW_RELEASE_MIRROR_PROJECT: ${{ vars.AIGW_GITLAB_RELEASE_PROJECT }}
        run: |
          set -euo pipefail
          sh scripts/check-release-tag-signature.sh . "${GITHUB_REF_NAME}"
          sh scripts/check-package-runner.sh
          version="${GITHUB_REF_NAME#v}"
          AIGW_REQUIRE_FULL_MATRIX=1 sh scripts/package.sh "$version" dist
          sh scripts/test-release-package-layout.sh dist "$version"
      - name: Upload exact release matrix
        uses: actions/upload-artifact@v4
        with:
          name: aigw-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tag release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download exact release matrix
        uses: actions/download-artifact@v5
        with:
          name: aigw-${{ github.ref_name }}
          path: dist
      - name: Create or resume checksum-verified draft
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sh scripts/publish-github-release.sh dist
