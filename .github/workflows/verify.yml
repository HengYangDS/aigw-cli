name: Verify
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
"on":
  push:
    branches:
      - dev
      - main
    tags:
      - v*
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      native_platform:
        description: Native platform to qualify; partial runs do not establish full release readiness
        required: false
        type: choice
        default: all
        options:
          - all
          - darwin
          - linux
          - windows
      full_quality:
        description: Qualify all repository quality tools on each native platform
        required: false
        type: boolean
        default: false
      windows_clients:
        description: With baseline_tag, qualify real Windows clients through the existing release lifecycle
        required: false
        type: boolean
        default: false
      macos_keychain:
        description: With baseline_tag, qualify only the published predecessor Keychain journey on disposable macOS
        required: false
        type: boolean
        default: false
      performance:
        description: Measure published candidate_tag against baseline_tag with retained native samples
        required: false
        type: boolean
        default: false
      refresh_locks:
        description: Verify two native mise lock refreshes without changing committed inputs
        required: false
        type: boolean
        default: false
      commit_base:
        description: Optional exclusive base; defaults to the selected commit's parent for manual diagnostics
        required: false
        type: string
      baseline_tag:
        description: Optional historical release tag for packaged upgrade and rollback acceptance
        required: false
        type: string
      candidate_tag:
        description: With baseline_tag, consume this published candidate without rebuilding
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: true
jobs:
  accepted-ref-parity:
    name: Accepted ref parity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref_name == 'main'
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: '{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"${{ github.server_url }}/${{ github.repository }}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"${{ github.server_url }}/${{ github.repository }}/releases/download/mise-glab-v$1/$2"}'
        with:
          version: 2026.9.18
          install: true
          install_args: --locked
          cache: true
          cache_key_prefix: mise-${{ github.job }}
      - name: Verify main and dev name the same product object
        run: mise exec --locked -- go run ./tools/forge refs --remote origin --expect "main=${{ github.sha }}" --expect "dev=${{ github.sha }}"
  quality:
    name: Quality and governance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.ref_type == 'tag' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))
    env:
      MISE_ENABLE_TOOLS: go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:lycheeverse/lychee
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: '{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"${{ github.server_url }}/${{ github.repository }}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"${{ github.server_url }}/${{ github.repository }}/releases/download/mise-glab-v$1/$2"}'
        with:
          version: 2026.9.18
          install: true
          install_args: --locked
          cache: true
          cache_key_prefix: mise-${{ github.job }}
      - name: Prepare locked dependencies
        run: mise run bootstrap
      - name: Materialize provenance trust input
        env:
          AIGW_RELEASE_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ALLOWED_SIGNERS }}
        run: mise exec --locked -- go run ./tools/ci trust-input --output "$RUNNER_TEMP/aigw-allowed-signers" --github-env "$GITHUB_ENV"
      - name: Verify pushed release tag provenance
        if: github.ref_type == 'tag'
        env:
          SELECTED_TAG: ${{ github.ref_name }}
        run: mise exec --locked -- go run ./tools/forge tag --tag "$SELECTED_TAG" --allowed-signers "$AIGW_RELEASE_ALLOWED_SIGNERS_FILE"
      - name: Run quality and governance
        env:
          CGO_ENABLED: "1"
          AIGW_COMMIT_BASE: ${{ github.event.pull_request.base.sha || (github.ref_type == 'tag' && format('{0}^', github.sha)) || github.event.before || inputs.commit_base || format('{0}^', github.sha) }}
          AIGW_RELEASE_AUTHOR_EMAIL: ${{ vars.AIGW_RELEASE_AUTHOR_EMAIL }}
          AIGW_RELEASE_ALLOWED_SIGNERS_FILE: ${{ env.AIGW_RELEASE_ALLOWED_SIGNERS_FILE }}
          AIGW_CHANGELOG_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: mise exec --locked -- go run ./tools/ci quality
  linux-secret-service:
    name: Linux Secret Service
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: (github.ref_type == 'tag' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))) && (github.event_name != 'workflow_dispatch' || github.ref_type == 'tag' || inputs.native_platform == '' || inputs.native_platform == 'all' || inputs.native_platform == 'linux')
    env:
      MISE_ENABLE_TOOLS: go,github:goreleaser/goreleaser
      CGO_ENABLED: "1"
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: '{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"${{ github.server_url }}/${{ github.repository }}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"${{ github.server_url }}/${{ github.repository }}/releases/download/mise-glab-v$1/$2"}'
        with:
          version: 2026.9.18
          install: true
          install_args: --locked
          cache: true
          cache_key_prefix: mise-${{ github.job }}
      - name: Qualify Linux Secret Service
        run: |-
          sudo -n timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo -n DEBIAN_FRONTEND=noninteractive timeout --verbose --kill-after=5s 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y dbus-x11 gnome-keyring libglib2.0-bin
          dbus-run-session -- bash -euo pipefail <<'AIGW_SECRET_SERVICE'
          gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets --method org.freedesktop.Secret.Service.ReadAlias session | grep -Fq /org/freedesktop/secrets/collection/session
          gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets --method org.freedesktop.Secret.Service.SetAlias default /org/freedesktop/secrets/collection/session >/dev/null
          result=$(AIGW_VERIFY_SYSTEM_KEYRING=1 mise exec --locked -- go test ./tools/release -run "^TestNativeProductJourney/system_credential_store$" -count=1 -v 2>&1) || {
            printf '%s\n' "$result"
            exit 1
          }
          printf '%s\n' "$result"
          grep -Fq -- "--- PASS: TestNativeProductJourney/system_credential_store" <<<"$result"
          AIGW_SECRET_SERVICE
  release-version:
    name: Release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.ref_type == 'tag'
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: '{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"${{ github.server_url }}/${{ github.repository }}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"${{ github.server_url }}/${{ github.repository }}/releases/download/mise-glab-v$1/$2"}'
        with:
          version: 2026.9.18
          install: true
          install_args: --locked
          cache: true
          cache_key_prefix: mise-${{ github.job }}
      - name: Validate tag version
        run: mise exec --locked -- go run ./tools/release validate-version-tag
  native-darwin:
    name: Native macOS acceptance
    runs-on: macos-26-intel
    timeout-minutes: 25
    if: (github.ref_type == 'tag' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))) && (github.event_name != 'workflow_dispatch' || github.ref_type == 'tag' || inputs.native_platform == '' || inputs.native_platform == 'all' || inputs.native_platform == 'darwin')
    env:
      MISE_ENABLE_TOOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_quality && 'go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:lycheeverse/lychee,github:anchore/syft,gh,glab,github:indygreg/apple-platform-rs' || 'go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:anchore/syft,gh,glab,github:lycheeverse/lychee,github:indygreg/apple-platform-rs' }}
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        env:
          GODEBUG: http2client=0
          MISE_URL_REPLACEMENTS: '{"regex:^https://gitlab[.]com/gitlab-org/cli/-/releases/([^/]+)/downloads/([^/?]+)$":"${{ github.server_url }}/${{ github.repository }}/releases/download/mise-glab-$1/$2","regex:^https://gitlab[.]com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/([^/]+)/([^/?]+)$":"${{ github.server_url }}/${{ github.repository }}/releases/download/mise-glab-v$1/$2"}'
        with:
          version: 2026.9.18
          install: true
          install_args: --locked
          cache: true
          cache_key_prefix: mise-${{ github.job }}
      - name: Prepare locked dependencies
        run: mise run bootstrap
      - name: Verify native lock resolution
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_locks
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise run dependencies:resolve
      - name: Retain native lock observation
        if: always() && github.event_name == 'workflow_dispatch' && inputs.refresh_locks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mise-lock-darwin
          path: |
            mise.lock
            .mise/locks
          include-hidden-files: true
      - env:
          AIGW_SYSTEM_CREDENTIAL_TEST_SCOPE: ephemeral-host
        name: Run native macOS acceptance
        if: github.event_name != 'workflow_dispatch' || (!inputs.full_quality && inputs.baseline_tag == '')
        run: mise exec --locked -- go run ./tools/ci native --platform darwin
      - env:
          AIGW_SYSTEM_CREDENTIAL_TEST_SCOPE: ephemeral-host
          CGO_ENABLED: "1"
        name: Qualify all repository tools on macOS
        if: github.event_name == 'workflow_dispatch' && inputs.full_quality
        run: mise exec --locked -- go run ./tools/ci native --platform darwin --full-quality
      - name: Run historical release acceptance
        if: github.event_name == 'workflow_dispatch' && (inputs.baseline_tag != '' || inputs.candidate_tag != '' || inputs.windows_clients || inputs.macos_keychain || inputs.performance)
        shell: pwsh
        env:
          AIGW_SYSTEM_CREDENTIAL_TEST_SCOPE: ephemeral-host
          AIGW_VERIFY_SYSTEM_KEYRING: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_keychain && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          AIGW_BASELINE_TAG: ${{ inputs.baseline_tag }}
          AIGW_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          AIGW_RELEASE_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ALLOWED_SIGNERS }}
          AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS }}
          AIGW_RELEASE_ARTIFACT_SIGNER: ${{ vars.AIGW_RELEASE_ARTIFACT_SIGNER }}
          AIGW_QUALIFY_WINDOWS_CLIENTS: ${{ inputs.windows_clients }}
          AIGW_MEASURE_PERFORMANCE: ${{ inputs.performance }}
        run: |-
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:AIGW_BASELINE_TAG)) { throw 'Client qualification requires baseline_tag' }
          if ($env:AIGW_MEASURE_PERFORMANCE -eq 'true' -and [string]::IsNullOrWhiteSpace($env:AIGW_CANDIDATE_TAG)) { throw 'Performance qualification requires candidate_tag' }
          $scope = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          $originalGitConfigGlobal = [Environment]::GetEnvironmentVariable('GIT_CONFIG_GLOBAL')
          New-Item -ItemType Directory -Path $scope | Out-Null
          try {
            $platform = mise exec --locked -- go env GOOS
            $env:AIGW_RELEASE_ALLOWED_SIGNERS_FILE = Join-Path $scope 'source-signers'
            $env:AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE = Join-Path $scope 'artifact-signers'
            [IO.File]::WriteAllText($env:AIGW_RELEASE_ALLOWED_SIGNERS_FILE, $env:AIGW_RELEASE_ALLOWED_SIGNERS)
            [IO.File]::WriteAllText($env:AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE, $env:AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS)
            $acceptance = @('accept-native', '--peer', 'github', '--repository', $env:GITHUB_REPOSITORY)
            $acceptance += @('--baseline-tag', $env:AIGW_BASELINE_TAG)
            if (-not [string]::IsNullOrWhiteSpace($env:AIGW_CANDIDATE_TAG)) {
              $acceptance += @('--tag', $env:AIGW_CANDIDATE_TAG)
            }
            $downloadToken = $env:GH_TOKEN
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            if ($platform -eq 'windows' -and $env:AIGW_QUALIFY_WINDOWS_CLIENTS -eq 'true') {
              $clients = Join-Path $scope 'clients'
              New-Item -ItemType Directory -Path $clients | Out-Null
              Set-Content -LiteralPath (Join-Path $clients 'package.json') -Value '{"private":true}'
              mise exec --locked -- npm install --prefix $clients --ignore-scripts --save-exact --no-audit --no-fund '@openai/codex@0.159.3' '@anthropic-ai/claude-code-win32-x64@2.1.286'
              mise exec --locked -- npm audit signatures --prefix $clients
              $codexRoot = Join-Path $clients 'node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc'
              $env:AIGW_ACCEPTANCE_CODEX = Join-Path $codexRoot 'bin/codex.exe'
              $env:AIGW_ACCEPTANCE_CLAUDE = Join-Path $clients 'node_modules/@anthropic-ai/claude-code-win32-x64/claude.exe'
              $hermesCommit = 'f97608f178d1ffeca59860195ab7da295f7c8e5f'
              $hermesInstallerDigest = '0a80dfeb7434229933bac32e73140d10086dff81bd84b156e71be9abc87cddf2'
              $hermesInstaller = Join-Path $env:RUNNER_TEMP 'aigw-hermes-install.ps1'
              $hermesHome = Join-Path $scope 'hermes'
              $hermesInstall = Join-Path $hermesHome 'hermes-agent'
              # The pinned installer changes autocrlf after cloning; set it before Git checks out LF files.
              $env:GIT_CONFIG_GLOBAL = Join-Path $scope 'hermes-gitconfig'
              git config --file $env:GIT_CONFIG_GLOBAL core.autocrlf false
              if ($LASTEXITCODE -ne 0) { throw 'Hermes Git checkout configuration failed' }
              $env:UV_CACHE_DIR = Join-Path $scope 'uv-cache'
              $env:GIT_TERMINAL_PROMPT = '0'
              if (-not (Test-Path -LiteralPath $hermesInstaller -PathType Leaf)) { throw 'Pinned Hermes installer is missing' }
              if ((Get-FileHash -LiteralPath $hermesInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hermesInstallerDigest) {
                throw 'Pinned Hermes installer checksum mismatch'
              }
              foreach ($stage in @('uv', 'git', 'repository', 'python', 'venv', 'dependencies')) {
                $frames = @(& pwsh -NoProfile -File $hermesInstaller -Commit $hermesCommit -HermesHome $hermesHome -InstallDir $hermesInstall -NonInteractive -Json -Stage $stage)
                if ($LASTEXITCODE -ne 0 -or $frames.Count -eq 0) { throw "Hermes install stage failed: $stage" }
                $frame = $frames[-1] | ConvertFrom-Json
                if ($frame.stage -ne $stage -or -not $frame.ok -or $frame.skipped) { throw "Hermes install stage was not admitted: $stage" }
                if ($stage -eq 'dependencies' -and -not ($frames -match 'hash-verified via uv.lock')) {
                  throw 'Hermes dependencies were not installed from the pinned uv.lock'
                }
              }
              $observedHermesCommit = git -C $hermesInstall rev-parse HEAD
              if ($LASTEXITCODE -ne 0 -or $observedHermesCommit.Trim() -ne $hermesCommit) { throw 'Hermes installed source differs from the pinned commit' }
              $env:AIGW_ACCEPTANCE_HERMES = Join-Path $hermesInstall 'venv/Scripts/hermes.exe'
              $gitBin = Split-Path (Get-Command git.exe).Source
              $bash = Join-Path (Split-Path $gitBin) 'bin/bash.exe'
              if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) { throw 'Claude requires a native Git Bash installation' }
              $env:CLAUDE_CODE_GIT_BASH_PATH = $bash
              $env:AIGW_ACCEPTANCE_CLIENT_PATH = @((Join-Path $codexRoot 'codex-path'), (Join-Path $hermesHome 'bin'), (Join-Path $hermesInstall 'venv/Scripts'), (Split-Path (Get-Command node.exe).Source), $gitBin, (Split-Path $bash), (Join-Path $env:SystemRoot 'System32')) -join ';'
              foreach ($client in @($env:AIGW_ACCEPTANCE_CODEX, $env:AIGW_ACCEPTANCE_CLAUDE, $env:AIGW_ACCEPTANCE_HERMES)) {
                if (-not (Test-Path -LiteralPath $client -PathType Leaf)) { throw "Missing native client: $client" }
                Get-FileHash -LiteralPath $client -Algorithm SHA256
              }
              $acceptance += '--clients'
            }
            $env:GH_TOKEN = $downloadToken
            if ($env:AIGW_MEASURE_PERFORMANCE -eq 'true') {
              $env:MISE_ENABLE_TOOLS += ',github:sharkdp/hyperfine'
              $output = Join-Path $env:GITHUB_WORKSPACE 'build/performance'
              $performance = $acceptance[1..($acceptance.Count - 1)] + @('--performance', $output)
              mise run performance @performance
            } else {
              mise exec --locked -- go run ./tools/release @acceptance
            }
          } finally {
            if ($null -eq $originalGitConfigGlobal) {
              Remove-Item Env:GIT_CONFIG_GLOBAL -ErrorAction SilentlyContinue
            } else {
              $env:GIT_CONFIG_GLOBAL = $originalGitConfigGlobal
            }
            foreach ($name in @('GH_TOKEN', 'AIGW_RELEASE_ALLOWED_SIGNERS_FILE', 'AIGW_RELEASE_ARTIFACT_ALLOWED_SIGNERS_FILE', 'AIGW_ACCEPTANCE_CODEX', 'AIGW_ACCEPTANCE_CLAUDE', 'AIGW_ACCEPTANCE_HERMES', 'AIGW_ACCEPTANCE_CLIENT_PATH', 'CLAUDE_CODE_GIT_BASH_PATH', 'UV_CACHE_DIR', 'GIT_TERMINAL_PROMPT')) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
            if ($platform -eq 'windows' -and $env:AIGW_QUALIFY_WINDOWS_CLIENTS -eq 'true') {
              Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'aigw-hermes-install.ps1') -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $scope -Recurse -Force
          }
      - name: Retain native performance samples
        if: always() && github.event_name == 'workflow_dispatch' && inputs.performance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-darwin
          path: build/performance
          if-no-files-found: error
  native-linux:
    name: Native Linux acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: (github.ref_type == 'tag' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))) && (github.event_name != 'workflow_dispatch' || github.ref_type == 'tag' || inputs.native_platform == '' || inputs.native_platform == 'all' || inputs.native_platform == 'linux')
    env:
      MISE_ENABLE_TOOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_quality && 'go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:lycheeverse/lychee,github:anchore/syft,gh,glab' || 'go,node,npm,cue,github:boyter/scc,github:editorconfig-checker/editorconfig-checker,github:gitleaks/gitleaks,github:golangci/golangci-lint,github:goreleaser/goreleaser,github:google/osv-scanner,github:rhysd/actionlint,shellcheck,taplo,typos,github:anchore/syft,gh,glab,github:lycheeverse/lychee' }}
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
