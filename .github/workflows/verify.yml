name: Verify
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - dev
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-governance:
    name: Source and governance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MISE_ENABLE_TOOLS: go,node,cue,npm:@fission-ai/openspec,github:gitleaks/gitleaks,github:rhysd/actionlint,github:lycheeverse/lychee
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: false
      - name: Materialize provenance trust input
        env:
          AIGW_RELEASE_ALLOWED_SIGNERS: ${{ vars.AIGW_RELEASE_ALLOWED_SIGNERS }}
        run: mise exec --locked -- go run ./tools/ci trust-input --output "$RUNNER_TEMP/aigw-allowed-signers" --github-env "$GITHUB_ENV"
      - name: Verify pushed release tag provenance
        if: github.ref_type == 'tag'
        env:
          SELECTED_TAG: ${{ github.ref_name }}
        run: mise exec --locked -- go run ./tools/forge tag --tag "$SELECTED_TAG" --allowed-signers "$AIGW_RELEASE_ALLOWED_SIGNERS_FILE"
      - name: Run source and governance
        env:
          CGO_ENABLED: "1"
          AIGW_RELEASE_AUTHOR_EMAIL: ${{ vars.AIGW_RELEASE_AUTHOR_EMAIL }}
          AIGW_RELEASE_ALLOWED_SIGNERS_FILE: ${{ env.AIGW_RELEASE_ALLOWED_SIGNERS_FILE }}
          AIGW_CHANGELOG_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: mise exec --locked -- go run ./tools/ci source
  native-darwin:
    name: Native macOS acceptance
    runs-on: macos-latest
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: false
      - name: Run native macOS acceptance
        env:
          AIGW_SYSTEM_CREDENTIAL_TEST_SCOPE: ephemeral-host
          AIGW_VERIFY_SYSTEM_KEYRING: "1"
        run: mise exec --locked -- go run ./tools/ci native --platform darwin
    timeout-minutes: 25
  native-linux:
    name: Native Linux acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: false
      - name: Install Secret Service
        run: sudo -- sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dbus-x11 gnome-keyring'
      - name: Run native Linux acceptance
        run: dbus-run-session -- sh -c 'printf \"\\n\" | gnome-keyring-daemon --unlock >/dev/null; export AIGW_VERIFY_SYSTEM_KEYRING=1; mise exec --locked -- go run ./tools/ci native --platform linux'
    timeout-minutes: 25
  native-windows:
    name: Native Windows acceptance
    runs-on: windows-latest
    steps:
      - name: Check out the exact product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the locked toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: false
      - name: Run native Windows acceptance
        env:
          AIGW_VERIFY_SYSTEM_KEYRING: "1"
        run: mise exec --locked -- go run ./tools/ci native --platform windows
    timeout-minutes: 25
