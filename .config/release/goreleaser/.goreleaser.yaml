# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: aigw

snapshot:
  version_template: "{{ .Env.AIGW_VERSION }}"

metadata:
  mod_timestamp: "{{ .Env.AIGW_RELEASE_EPOCH }}"

builds:
  - &portable
    id: portable
    main: ./cmd/aigw
    binary: aigw
    goos: [linux]
    skip: '{{ and (ne .Env.AIGW_BUILD_OS "") (ne .Env.AIGW_BUILD_OS "linux") }}'
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    mod_timestamp: "{{ .Env.AIGW_RELEASE_EPOCH }}"
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - >-
        -s -w
        -X aigw-cli/internal/cli.Version={{ .Version }}
        -X aigw-cli/internal/program.BuildGitHubReleaseOrigin={{ .Env.AIGW_GITHUB_RELEASE_ORIGIN }}
        -X aigw-cli/internal/program.BuildGitHubReleaseRepository={{ .Env.AIGW_GITHUB_RELEASE_REPOSITORY }}
        -X 'aigw-cli/internal/program/artifact.BuildReleasePublicKey={{ .Env.AIGW_RELEASE_PUBLIC_KEY }}'
  - <<: *portable
    id: windows
    goos: [windows]
    skip: '{{ and (ne .Env.AIGW_BUILD_OS "") (ne .Env.AIGW_BUILD_OS "windows") }}'
  - <<: *portable
    id: macos
    goos: [darwin]
    skip: '{{ and (ne .Env.AIGW_BUILD_OS "") (ne .Env.AIGW_BUILD_OS "darwin") }}'
    # Go 1.27 and the published predecessor support macOS 13; the host SDK
    # must not raise the external linker's deployment target.
    # Compiler arguments are part of Go's cache key; the deployment environment
    # alone can reuse CGO objects compiled for a newer host.
    env: [CGO_ENABLED=1, "CC=clang -mmacosx-version-min=13.0"]
    hooks:
      post:
        - cmd: >-
            {{ if .Env.AIGW_MACOS_SIGNING_IDENTITY }}
            /usr/bin/codesign --force --sign "{{ .Env.AIGW_MACOS_SIGNING_IDENTITY }}"
            --options runtime --timestamp "{{ .Path }}"
            {{ else }}
            rcodesign -C /dev/null sign
            --binary-identifier "{{ .ProjectName }}"
            --code-signature-flags runtime
            --signing-time "{{ .Env.AIGW_RELEASE_TIMESTAMP }}"
            --timestamp-url none "{{ .Path }}"
            {{ end }}

archives:
  - ids: [portable, windows, macos]
    name_template: "aigw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    builds_info:
      owner: root
      group: root
      mtime: "{{ .Env.AIGW_RELEASE_TIMESTAMP }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .Env.AIGW_RELEASE_TIMESTAMP }}"
      - src: LICENSE
        info:
          owner: root
          group: root
          mtime: "{{ .Env.AIGW_RELEASE_TIMESTAMP }}"

checksum:
  name_template: checksums.txt

sboms:
  - disable: true

changelog:
  disable: true

release:
  disable: true

# Generated packaging remains local until the accepted release is published.
homebrew_casks:
  - name: aigw
    repository:
      owner: HengYangDS
      name: homebrew-tap
    skip_upload: true
    homepage: https://github.com/HengYangDS/aigw-cli
    description: Local control plane for AI providers, models and client configuration
    url:
      template: "https://github.com/HengYangDS/aigw-cli/releases/download/v{{ .Version }}/{{ .ArtifactName }}"
    caveats: |
      Run aigw setup to configure a provider and explicitly enable clients.

      Upgrading from 0.6.1 or earlier: 0.7.0 reads only aigw.toml and never
      reads or changes config.toml or its component files. After upgrading,
      run aigw setup --from <team file> or aigw setup, then run
      aigw use <client> <provider/model> for each client. Tokens already
      stored are reused. Client sessions started before the upgrade keep
      working; delete config.toml and config.*.toml once they have ended.
      Hermes sessions started before the upgrade name provider IDs that no
      longer exist. aigw self rollback cannot return to a release older
      than 0.7.0.

      Before uninstalling, run aigw status and aigw client disable <client>
      for each enabled client. Configuration and Tokens remain available.
