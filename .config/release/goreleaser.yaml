# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: aigw

snapshot:
  version_template: "{{ .Env.AIGW_VERSION }}"

metadata:
  mod_timestamp: "{{ .Env.AIGW_RELEASE_EPOCH }}"

builds:
  - &portable
    id: portable
    main: ./cmd/aigw
    binary: aigw
    goos: [linux]
    skip: '{{ and (ne .Env.AIGW_BUILD_OS "") (ne .Env.AIGW_BUILD_OS "linux") }}'
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    mod_timestamp: "{{ .Env.AIGW_RELEASE_EPOCH }}"
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - >-
        -s -w
        -X aigw-cli/internal/cli.Version={{ .Version }}
        -X aigw-cli/internal/upgrade.BuildGitLabReleaseOrigin={{ .Env.AIGW_GITLAB_RELEASE_ORIGIN }}
        -X aigw-cli/internal/upgrade.BuildGitLabReleaseRepository={{ .Env.AIGW_GITLAB_RELEASE_REPOSITORY }}
        -X aigw-cli/internal/upgrade.BuildGitHubReleaseOrigin={{ .Env.AIGW_GITHUB_RELEASE_ORIGIN }}
        -X aigw-cli/internal/upgrade.BuildGitHubReleaseRepository={{ .Env.AIGW_GITHUB_RELEASE_REPOSITORY }}
  - <<: *portable
    id: windows
    goos: [windows]
    skip: '{{ and (ne .Env.AIGW_BUILD_OS "") (ne .Env.AIGW_BUILD_OS "windows") }}'
  - <<: *portable
    id: macos
    goos: [darwin]
    skip: '{{ and (ne .Env.AIGW_BUILD_OS "") (ne .Env.AIGW_BUILD_OS "darwin") }}'
    hooks:
      post:
        - cmd: >-
            rcodesign -C /dev/null sign
            --binary-identifier "{{ .ProjectName }}"
            --code-signature-flags runtime
            --signing-time "{{ .Env.AIGW_RELEASE_TIMESTAMP }}"
            --timestamp-url none "{{ .Path }}"

archives:
  - ids: [portable, windows, macos]
    name_template: "aigw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    builds_info:
      owner: root
      group: root
      mtime: "{{ .Env.AIGW_RELEASE_TIMESTAMP }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .Env.AIGW_RELEASE_TIMESTAMP }}"
      - src: LICENSE
        info:
          owner: root
          group: root
          mtime: "{{ .Env.AIGW_RELEASE_TIMESTAMP }}"

checksum:
  name_template: checksums.txt

sboms:
  - disable: true

changelog:
  disable: true

release:
  disable: true

# Generated packaging remains local until the accepted release is published.
homebrew_casks:
  - name: aigw
    repository:
      owner: HengYangDS
      name: homebrew-tap
    skip_upload: true
    homepage: https://github.com/HengYangDS/aigw-cli
    description: Local control plane for AI provider accounts and client configuration
    url:
      template: "https://github.com/HengYangDS/aigw-cli/releases/download/v{{ .Version }}/{{ .ArtifactName }}"
    caveats: |
      Run aigw setup to configure a provider and explicitly enable clients.
      Before uninstalling, run aigw adapter list and aigw adapter disable <client>
      for each enabled client. Configuration and Tokens remain available.
