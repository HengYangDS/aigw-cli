title = "AIGW secret scanning policy"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "The architecture graph names a package, not a credential value."
condition = "AND"
paths = ['''^\.config/checks/architecture/policy\.toml$''']
regexTarget = "secret"
regexes = ['''^internal/diagnostics$''']
