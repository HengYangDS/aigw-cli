# Architecture layout gate — SSOT for repository semantic topology.
# Consumed by tools/architecture; values are not hardcoded in the checker.
owner = "product-toolchain"
source = "repository architecture layout"
risk_model = "undeclared semantic owners and dependency edges create hidden coupling, ambiguous authority, and non-local change risk"
measurement = "parse tracked Go packages, exact import edges, composition roots, semantic carriers, Decision Records, and deterministic text bytes against this declared contract"
false_positive_cost = "a valid new semantic owner or dependency requires an intentional policy update reviewed with the implementation"
remediation = "move behavior to an existing owner, delete an unused allowance, or declare a required owner and dependency here with focused contract tests"
review_condition = "reassess when the product topology changes or when two legitimate changes in one release train are blocked by the same contract"

# Managed Go trees subject to topology, naming, and AST rules.
go_roots = ["cmd", "internal", "tools"]

# Direct semantic owners form a closed, positive topology. Adding a new domain
# is an architecture change; provider implementations remain extensible below
# the declared provider owner.
package_children."cmd" = ["aigw"]
package_children."internal" = [
  "app",
  "cli",
  "client",
  "clients",
  "domain",
  "platform",
  "program",
  "provider",
  "secret",
  "store",
  "terminal",
]
package_children."internal/platform" = ["process"]
package_children."internal/app" = [
  "activation",
  "diagnostics",
  "readiness",
  "renaming",
  "synchronization",
]
package_children."tools" = [
  "architecture",
  "ci",
  "codex",
  "coverage",
  "forge",
  "gitfixture",
  "release",
]
package_children."internal/client/codex" = ["catalog"]
package_children."internal/client" = [
  "claude",
  "claudedesktop",
  "codex",
  "contract",
  "discovery",
  "hermes",
  "surface",
  "verification",
]
package_children."internal/program" = ["acceptance", "artifact"]
package_children."tools/ci" = [
  "bootstrap",
  "evidence",
  "markdown",
  "projection",
  "test",
]
package_children."tools/codex" = ["catalog"]
package_children."tools/release" = [
  "construction",
  "performance",
  "provenance",
  "publication",
  "readiness",
]

# Packages whose production files may import only the standard library.
standard_library_only = ["internal/domain"]

# Packages whose exported top-level identifiers each have a user outside the
# package, as tools/architecture counts one.
