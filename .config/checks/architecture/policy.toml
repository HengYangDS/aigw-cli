# Architecture layout gate — SSOT for Go repository structure checks.
# Consumed by tools/architecture; values are not hardcoded in the checker.
owner = "product-toolchain"
source = "repository architecture layout"
risk_model = "undeclared semantic owners and dependency edges create hidden coupling, ambiguous authority, and non-local change risk"
measurement = "parse tracked Go packages, imports, composition roots, semantic carriers, Decision Records, and deterministic text bytes against this declared contract"
false_positive_cost = "a valid new semantic owner or dependency requires an intentional policy update reviewed with the implementation"
remediation = "move behavior to an existing owner or declare the new owner and dependency here with focused contract tests"
review_condition = "reassess when the product topology changes or when two legitimate changes in one release train are blocked by the same contract"

# Managed Go trees subject to topology, naming, and AST rules.
go_roots = ["cmd", "internal", "tools"]

# Direct semantic owners form a closed, positive topology. Adding a new domain
# is an architecture change; provider implementations remain extensible below
# the declared providers owner.
package_children = {
  "cmd" = ["aigw"],
  "internal" = [
    "account", "claude", "cli", "codex", "configuration", "console",
    "credential", "diagnostics", "discovery", "platform", "presentation",
    "process", "prompt", "providers", "readiness", "redaction", "renaming",
    "secrets", "surface", "synchronization", "transaction", "upgrade",
    "verification",
    "winjob",
  ],
  "tools" = ["architecture", "ci", "coverage", "forge", "modelcatalog", "release", "repository"],
}

# Composition roots may contain only their declared production files. Command
# behavior belongs to semantic subpackages, never beside the root assembler.
composition_root_files = { "internal/cli" = ["app.go"] }

# CLI leaf packages are peers. They may depend on the invocation capability
# contract, but never on another command leaf; shared behavior belongs to a
# domain package outside internal/cli.
peer_package_roots = { "internal/cli" = ["invocation"] }

# Repository tools are independent composition roots. They may use the standard
# library and declared third-party libraries, but never product runtime packages.
allowed_import_edges = {
  "cmd/aigw" = ["internal/cli", "internal/presentation"],
  "internal/transaction" = [],
  "internal/credential" = ["internal/configuration", "internal/secrets"],
  "internal/configuration" = ["internal/transaction"],
  "internal/upgrade" = [],
  "internal/renaming" = ["internal/account", "internal/configuration", "internal/presentation", "internal/prompt", "internal/providers", "internal/secrets", "internal/synchronization"],
  "internal/synchronization" = ["internal/claude", "internal/codex", "internal/configuration", "internal/discovery", "internal/process", "internal/secrets", "internal/surface"],
  "internal/secrets" = ["internal/configuration", "internal/transaction"],
  "internal/claude" = ["internal/configuration", "internal/discovery", "internal/process", "internal/transaction"],
  "internal/providers" = ["internal/account", "internal/configuration", "internal/providers/dmxapi"],
  "internal/providers/dmxapi" = ["internal/account", "internal/configuration", "internal/redaction"],
  "internal/platform" = [],
  "internal/codex" = ["internal/configuration", "internal/process", "internal/surface", "internal/transaction"],
  "internal/discovery" = ["internal/configuration", "internal/surface"],
  "internal/surface" = [],
  "internal/readiness" = ["internal/diagnostics"],
  "internal/cli" = ["internal/account", "internal/cli/account", "internal/cli/adapter", "internal/cli/catalog", "internal/cli/credential", "internal/cli/doctor", "internal/cli/install", "internal/cli/invocation", "internal/cli/manifest", "internal/cli/onboarding", "internal/cli/profile", "internal/cli/readiness", "internal/cli/recovery", "internal/cli/route", "internal/cli/update", "internal/cli/verification", "internal/configuration", "internal/console", "internal/discovery", "internal/platform", "internal/presentation", "internal/process", "internal/prompt", "internal/readiness", "internal/renaming", "internal/secrets", "internal/synchronization", "internal/upgrade"],
  "internal/cli/invocation" = ["internal/account", "internal/configuration", "internal/discovery", "internal/presentation", "internal/process", "internal/prompt", "internal/secrets", "internal/synchronization", "internal/upgrade"],
  "internal/cli/credential" = ["internal/cli/invocation", "internal/configuration"],
  "internal/cli/install" = ["internal/cli/invocation", "internal/transaction"],
  "internal/cli/route" = ["internal/cli/invocation", "internal/configuration", "internal/credential", "internal/presentation", "internal/prompt"],
  "internal/cli/update" = ["internal/cli/invocation", "internal/upgrade"],
  "internal/cli/recovery" = ["internal/cli/invocation", "internal/codex", "internal/configuration", "internal/discovery", "internal/presentation", "internal/surface", "internal/synchronization"],
  "internal/cli/catalog" = ["internal/configuration", "internal/presentation", "internal/secrets"],
  "internal/cli/manifest" = ["internal/cli/invocation", "internal/configuration", "internal/credential", "internal/presentation", "internal/secrets"],
  "internal/cli/doctor" = ["internal/claude", "internal/codex", "internal/configuration", "internal/credential", "internal/presentation", "internal/readiness", "internal/secrets"],
  "internal/cli/adapter" = ["internal/cli/invocation", "internal/configuration", "internal/credential", "internal/discovery", "internal/presentation", "internal/surface"],
  "internal/cli/verification" = ["internal/cli/invocation", "internal/configuration", "internal/credential", "internal/presentation", "internal/verification"],
  "internal/cli/profile" = ["internal/cli/invocation", "internal/configuration", "internal/presentation", "internal/synchronization"],
  "internal/cli/readiness" = [
    "internal/claude",
    "internal/cli/invocation",
    "internal/codex",
    "internal/configuration",
    "internal/credential",
    "internal/diagnostics",
    "internal/presentation",
    "internal/providers",
    "internal/readiness",
    "internal/secrets",
  ],
  "internal/cli/account" = ["internal/account", "internal/cli/invocation", "internal/configuration", "internal/credential", "internal/presentation", "internal/providers", "internal/secrets", "internal/synchronization"],
  "internal/cli/onboarding" = ["internal/cli/invocation", "internal/configuration", "internal/credential", "internal/presentation", "internal/prompt", "internal/secrets", "internal/verification"],
  "internal/verification" = ["internal/claude", "internal/codex", "internal/configuration", "internal/process"],
  "internal/prompt" = [],
  "internal/redaction" = [],
  "internal/diagnostics" = ["internal/configuration", "internal/credential", "internal/redaction"],
  "internal/winjob" = [],
  "internal/account" = ["internal/configuration"],
  "internal/presentation" = ["internal/configuration"],
  "internal/process" = ["internal/winjob"],
  "internal/console" = [],
  "tools/repository" = [],
  "tools/ci" = [],
  "tools/release" = [],
  "tools/architecture" = [],
  "tools/forge" = [],
  "tools/modelcatalog" = ["internal/codex"],
  "tools/coverage" = [],
}

# Top-level roots skipped entirely while walking the repository.
ignore_roots = ["vendor", ".git", "records", "build"]

# Directory base names skipped anywhere in the walk (runtime / VCS residue).
ignore_directory_names = ["vendor", ".git", "records", "runtime", "node_modules"]

# Source and carrier contracts inside managed roots.
check_decision_records = true
check_semantic_names = true
require_import_owners = true
