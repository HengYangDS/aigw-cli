# Architecture layout gate — SSOT for repository semantic topology.
# Consumed by tools/architecture; values are not hardcoded in the checker.
owner = "product-toolchain"
source = "repository architecture layout"
risk_model = "undeclared semantic owners and dependency edges create hidden coupling, ambiguous authority, and non-local change risk"
measurement = "parse tracked Go packages, layered imports, composition roots, semantic carriers, Decision Records, and deterministic text bytes against this declared contract"
false_positive_cost = "a valid new semantic owner, layer row, seam or floor requires an intentional policy update reviewed with the implementation"
remediation = "move behavior to an existing owner or a lower layer, delete an unused prefix, seam or floor, or declare a required owner, row, seam or floor here with focused contract tests"
review_condition = "reassess when the product topology changes or when two legitimate changes in one release train are blocked by the same contract"

# Managed Go trees subject to topology, naming, and AST rules.
go_roots = ["cmd", "internal", "tools"]

# Direct semantic owners form a closed, positive topology. Adding a new domain
# is an architecture change; provider implementations remain extensible below
# the declared provider owner.
package_children."cmd" = ["aigw"]
package_children."internal" = [
  "app",
  "cli",
  "client",
  "clients",
  "domain",
  "platform",
  "program",
  "provider",
  "secret",
  "store",
  "terminal",
]
package_children."internal/platform" = ["process"]
package_children."internal/app" = [
  "activation",
  "diagnostics",
  "readiness",
  "renaming",
  "synchronization",
]
package_children."tools" = [
  "architecture",
  "ci",
  "codex",
  "coverage",
  "forge",
  "gitfixture",
  "release",
]
package_children."internal/client/codex" = ["catalog"]
package_children."internal/client" = [
  "claude",
  "claudedesktop",
  "codex",
  "contract",
  "discovery",
  "hermes",
  "surface",
  "verification",
]
package_children."internal/program" = ["acceptance", "artifact"]
package_children."tools/ci" = [
  "evidence",
  "markdown",
  "projection",
  "test",
]
package_children."tools/codex" = ["catalog"]
package_children."tools/release" = [
  "construction",
  "performance",
  "provenance",
  "publication",
  "readiness",
]

# Packages whose production files may import only the standard library.
standard_library_only = ["internal/domain"]

# Packages whose exported top-level identifiers each have a user outside the
# package, as tools/architecture counts one.
used_exports_only = [
  "internal/app",
  "internal/cli/account",
  "internal/cli/add",
  "internal/cli/balance",
  "internal/cli/catalog",
  "internal/cli/check",
  "internal/cli/client",
  "internal/cli/completion",
  "internal/cli/config",
  "internal/cli/credential",
  "internal/cli/doctor",
  "internal/cli/install",
  "internal/cli/installation",
  "internal/cli/invocation",
  "internal/cli/models",
  "internal/cli/repair",
  "internal/cli/rollback",
  "internal/cli/rotate",
  "internal/cli/route",
  "internal/cli/setup",
  "internal/cli/status",
  "internal/cli/sync",
  "internal/cli/test",
  "internal/cli/uninstall",
  "internal/cli/update",
  "internal/cli/use",
  "internal/cli/verify",
  "internal/domain",
  "internal/secret",
  "internal/secret/native",
  "internal/secret/probe",
  "internal/store",
  "internal/terminal",
]

# Composition roots may contain only their declared production files. Command
# behavior belongs to semantic subpackages, never beside the root assembler.
composition_root_files."internal/cli" = ["app.go"]
composition_root_files."tools/release" = ["commands.go", "main.go"]

# Packages form one ordered stack of layers, from the top. A package belongs to
# the row of its longest matching prefix. A production file may import its own
# descendants, the seams that layer_seams declares for a subtree that contains
# it, and the packages of lower rows. Test files are fixtures and are not
# checked. Repository tools sit above the product, and CI drives the release
# tool.
layers = [
  ["tools/ci"],
  ["tools"],
  ["cmd/aigw"],
  ["internal/cli", "internal/clients"],
  ["internal/app", "internal/terminal"],
  ["internal/app/renaming"],
  ["internal/app/activation", "internal/app/synchronization"],
  ["internal/app/readiness"],
  ["internal/app/diagnostics"],
  ["internal/client", "internal/program"],
  ["internal/provider", "internal/secret", "internal/store"],
  ["internal/domain", "internal/platform"],
]

# Command packages share CLI behavior only through internal/cli/invocation; a
# use case that several commands share belongs to internal/app. Adapters share
# the client seam and its discovery, surface and verification packages, and
# never import each other. The Providers share their diagnostic seam, and the
# release tool's packages share its performance, provenance and readiness
# libraries.
layer_seams."internal/cli" = ["internal/cli/invocation"]
layer_seams."internal/client" = [
  "internal/client",
  "internal/client/discovery",
  "internal/client/surface",
  "internal/client/verification",
]
layer_seams."internal/provider" = ["internal/provider/diagnostic"]
layer_seams."tools/release" = [
  "tools/release/performance",
  "tools/release/provenance",
  "tools/release/readiness",
]

# Repository tools import product packages from internal/client's row down,
# never the command tree or its use cases. internal/terminal renders what the
# use cases return and imports none of them.
layer_floors."internal/terminal" = "internal/client"
layer_floors."tools" = "internal/client"

# Top-level roots skipped entirely while walking the repository.
ignore_roots = ["vendor", ".git", "build"]

# Directory base names skipped anywhere in the walk (runtime / VCS residue).
ignore_directory_names = ["vendor", ".git", "node_modules"]

# Source and carrier contracts inside managed roots.
check_decision_records = true
check_semantic_names = true

# Each admitted client's knowledge stays in its adapter package below
# adapter_root, named after the client ID without hyphens. Outside it only the
# composition roots may name a client.
[client_confinement]
clients = ["claude", "claude-desktop", "codex", "hermes"]
product_roots = ["cmd", "internal"]
adapter_root = "internal/client"
composition_roots = ["cmd/aigw", "internal/clients"]
# Hermes names its OpenAI Responses API mode codex_responses; that value is
# Hermes vocabulary, not Codex knowledge.
native_terms.hermes = ["codex_responses"]

# Every tracked carrier resolves to exactly one semantic responsibility.
# Executable checks remain in tools/ci and their native tool configurations.
[tracked_carrier_classes.go-source]
responsibility = "product and repository-tool Go source"
prefixes = ["cmd", "internal", "tools"]
suffixes = [".go"]

[tracked_carrier_classes.acceptance-scripts]
responsibility = "command acceptance scripts that hold the CLI's behavior baseline"
prefixes = ["cmd/aigw/testdata/script"]
suffixes = [".txtar"]

[tracked_carrier_classes.native-check-adapters]
responsibility = "repository adapters for native Node quality libraries"
prefixes = ["tools/ci"]
suffixes = [".mjs"]

[tracked_carrier_classes.current-documentation]
responsibility = "current product and contributor documentation"
exact_paths = ["AGENTS.md", "CHANGELOG.md", "CONTRIBUTING.md", "README.md"]
prefixes = ["docs"]
suffixes = [".md"]

[tracked_carrier_classes.active-openspec]
responsibility = "current OpenSpec configuration, specifications, and active Change"
prefixes = ["openspec"]
exclude_prefixes = ["openspec/changes/archive"]

[tracked_carrier_classes.archived-openspec]
responsibility = "immutable OpenSpec history"
prefixes = ["openspec/changes/archive"]

[tracked_carrier_classes.ethos-governance]
responsibility = "ETHOS adoption and release binding"
prefixes = [".ethos"]

[tracked_carrier_classes.ci-authority]
responsibility = "single CI semantic graph"
exact_paths = [".config/ci/pipeline.cue"]

[tracked_carrier_classes.ci-retention]
responsibility = "recorded operating-system glue that projected CI steps keep as shell"
exact_paths = [".config/ci/retained-steps.toml"]

[tracked_carrier_classes.ci-projection]
responsibility = "generated GitHub and GitLab CI projections"
exact_paths = [".gitlab-ci.yml"]
prefixes = [".github"]

[tracked_carrier_classes.quality-policy]
responsibility = "native quality-tool policy"
prefixes = [".config/checks"]
exclude_prefixes = [".config/checks/renovate"]

[tracked_carrier_classes.release-policy]
responsibility = "release construction and Forge metadata"
prefixes = [".config/release"]

[tracked_carrier_classes.dependency-policy]
responsibility = "single dependency-update proposal policy"
prefixes = [".config/checks/renovate"]

[tracked_carrier_classes.team-manifest]
responsibility = "reviewed team capability manifest"
prefixes = ["manifests"]

[tracked_carrier_classes.toolchain]
responsibility = "development tooling and locked dependency closure"
prefixes = [".config/mise", ".config/npm"]
exact_paths = [
  ".config/miserc.toml",
  "go.mod",
  "go.sum",
  "package-lock.json",
  "package.json",
]

[tracked_carrier_classes.repository-metadata]
responsibility = "portable repository and product metadata"
exact_paths = [
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  "LICENSE",
  "VERSION",
]
