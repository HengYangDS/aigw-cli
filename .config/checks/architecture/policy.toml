# Architecture layout gate — SSOT for Go repository structure checks.
# Consumed by tools/architecture; values are not hardcoded in the checker.
owner = "product-toolchain"
source = "repository architecture layout"

# Managed Go trees subject to flat-directory, suffix-flat, naming, and AST rules.
go_roots = ["cmd", "internal", "tools"]

# Direct semantic owners form a closed, positive topology. Adding a new domain
# is an architecture change; provider implementations remain extensible below
# the declared providers owner.
package_children = {
  "cmd" = ["aigw"],
  "internal" = [
    "account", "claude", "cli", "codex", "configuration", "console",
    "credential", "diagnostics", "discovery", "platform", "presentation",
    "process", "prompt", "providers", "redaction", "renaming", "secrets",
    "surface", "synchronization", "transaction", "upgrade", "verification",
    "winjob",
  ],
  "tools" = ["architecture", "ci", "coverage", "forge", "release", "repository"],
}

# Composition roots may contain only their declared production files. Command
# behavior belongs to semantic subpackages, never beside the root assembler.
composition_root_files = { "internal/cli" = ["app.go"] }

# CLI leaf packages are peers. They may depend on the invocation capability
# contract, but never on another command leaf; shared behavior belongs to a
# domain package outside internal/cli.
peer_package_roots = { "internal/cli" = ["invocation"] }

# Repository tools are independent composition roots. They may use the standard
# library and declared third-party libraries, but never product runtime packages.
allowed_import_edges = {
  "tools/architecture" = [],
  "tools/ci" = [],
  "tools/coverage" = [],
  "tools/forge" = [],
  "tools/release" = [],
  "tools/repository" = [],
}

# Production .go files per directory (test files reported separately).
flat_directory_limit = 8

# Effective non-comment source and AST decision-branch budgets. These reject the
# false-green tactic of concatenating unrelated owners into fewer large files.
max_file_eloc = 600
max_directory_eloc = 3000
max_file_complexity = 180
max_directory_complexity = 900

# Same prefix foo_*.go group size that fails (after platform-variant collapse).
suffix_flat_group_min = 3

# Platform build suffixes treated as one semantic implementation for suffix-flat.
# Do not generalize beyond this explicit list.
platform_build_suffixes = ["unix", "windows", "darwin", "linux", "posix"]

# Top-level roots skipped entirely while walking the repository.
ignore_roots = ["vendor", ".git", "records", "build"]

# Directory base names skipped anywhere in the walk (runtime / VCS residue).
ignore_directory_names = ["vendor", ".git", "records", "runtime", "node_modules"]

# AST surface rules inside managed Go roots.
check_exported_type_alias = true
check_function_var_alias = true
check_package_documentation = true
check_trivial_wrappers = true
check_decision_records = true
check_semantic_names = true
check_module_identity = true
check_portability = true
