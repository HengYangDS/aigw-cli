# Top-level roots skipped entirely while walking the repository.
ignore_roots = ["vendor", ".git", "build"]

# Directory base names skipped anywhere in the walk (runtime / VCS residue).
ignore_directory_names = ["vendor", ".git", "node_modules"]

# Source and carrier contracts inside managed roots.
check_decision_records = true
check_semantic_names = true
require_import_owners = true

# Each admitted client's knowledge stays in its adapter package below
# adapter_root, named after the client ID without hyphens. Outside it only the
# composition roots may name a client.
[client_confinement]
clients = ["claude", "claude-desktop", "codex", "hermes"]
product_roots = ["cmd", "internal"]
adapter_root = "internal/client"
composition_roots = ["cmd/aigw", "internal/clients"]
# Hermes names its OpenAI Responses API mode codex_responses; that value is
# Hermes vocabulary, not Codex knowledge.
native_terms.hermes = ["codex_responses"]

# Every tracked carrier resolves to exactly one semantic responsibility.
# Executable checks remain in tools/ci and their native tool configurations.
[tracked_carrier_classes.go-source]
responsibility = "product and repository-tool Go source"
prefixes = ["cmd", "internal", "tools"]
suffixes = [".go"]

[tracked_carrier_classes.acceptance-scripts]
responsibility = "command acceptance scripts that hold the CLI's behavior baseline"
prefixes = ["cmd/aigw/testdata/script"]
suffixes = [".txtar"]

[tracked_carrier_classes.native-check-adapters]
responsibility = "repository adapters for native Node quality libraries"
prefixes = ["tools/ci"]
suffixes = [".mjs"]

[tracked_carrier_classes.current-documentation]
responsibility = "current product and contributor documentation"
exact_paths = ["AGENTS.md", "CHANGELOG.md", "CONTRIBUTING.md", "README.md"]
prefixes = ["docs"]
suffixes = [".md"]

[tracked_carrier_classes.active-openspec]
responsibility = "current OpenSpec configuration, specifications, and active Change"
prefixes = ["openspec"]
exclude_prefixes = ["openspec/changes/archive"]

[tracked_carrier_classes.archived-openspec]
responsibility = "immutable OpenSpec history"
prefixes = ["openspec/changes/archive"]

[tracked_carrier_classes.ethos-governance]
responsibility = "ETHOS adoption and release binding"
prefixes = [".ethos"]

[tracked_carrier_classes.ci-authority]
responsibility = "single CI semantic graph"
exact_paths = [".config/ci/pipeline.cue"]

[tracked_carrier_classes.ci-retention]
responsibility = "recorded operating-system glue that projected CI steps keep as shell"
exact_paths = [".config/ci/retained-steps.toml"]

[tracked_carrier_classes.ci-bootstrap]
responsibility = "job-local CI toolchain bootstrap implementation"
prefixes = ["tools/ci/bootstrap"]
suffixes = [".ps1"]

[tracked_carrier_classes.ci-projection]
responsibility = "generated GitHub and GitLab CI projections"
exact_paths = [".gitlab-ci.yml"]
prefixes = [".github"]

[tracked_carrier_classes.quality-policy]
responsibility = "native quality-tool policy"
prefixes = [".config/checks"]
exclude_prefixes = [".config/checks/renovate"]

[tracked_carrier_classes.release-policy]
responsibility = "release construction and Forge metadata"
prefixes = [".config/release"]

[tracked_carrier_classes.dependency-policy]
responsibility = "single dependency-update proposal policy"
prefixes = [".config/checks/renovate"]

[tracked_carrier_classes.team-manifest]
responsibility = "reviewed team capability manifest"
prefixes = ["manifests"]

[tracked_carrier_classes.toolchain]
responsibility = "development tooling and locked dependency closure"
prefixes = [".config/mise", ".config/npm"]
exact_paths = [
  ".config/miserc.toml",
  "go.mod",
  "go.sum",
  "package-lock.json",
  "package.json",
]

[tracked_carrier_classes.repository-metadata]
responsibility = "portable repository and product metadata"
exact_paths = [
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  "LICENSE",
  "VERSION",
]
