# Architecture layout gate — SSOT for repository semantic topology.
# Consumed by tools/architecture; values are not hardcoded in the checker.
owner = "product-toolchain"
source = "repository architecture layout"
risk_model = "undeclared semantic owners and dependency edges create hidden coupling, ambiguous authority, and non-local change risk"
measurement = "parse tracked Go packages, exact import edges, composition roots, semantic carriers, Decision Records, and deterministic text bytes against this declared contract"
false_positive_cost = "a valid new semantic owner or dependency requires an intentional policy update reviewed with the implementation"
remediation = "move behavior to an existing owner, delete an unused allowance, or declare a required owner and dependency here with focused contract tests"
review_condition = "reassess when the product topology changes or when two legitimate changes in one release train are blocked by the same contract"

# Managed Go trees subject to topology, naming, and AST rules.
go_roots = ["cmd", "internal", "tools"]

# Direct semantic owners form a closed, positive topology. Adding a new domain
# is an architecture change; provider implementations remain extensible below
# the declared providers owner.
package_children."cmd" = ["aigw"]
package_children."internal" = [
  "activation",
  "cli",
  "client",
  "clients",
  "diagnostics",
  "discovery",
  "domain",
  "platform",
  "presentation",
  "process",
  "prompt",
  "providers",
  "readiness",
  "redaction",
  "renaming",
  "secret",
  "store",
  "surface",
  "synchronization",
  "upgrade",
]
package_children."tools" = [
  "architecture",
  "ci",
  "codex",
  "coverage",
  "forge",
  "gitfixture",
  "release",
]
package_children."internal/client/codex" = ["catalog"]
package_children."internal/client" = [
  "claude",
  "claudedesktop",
  "codex",
  "contract",
  "hermes",
  "verification",
]
package_children."internal/upgrade" = ["acceptance", "artifact"]
package_children."tools/ci" = [
  "bootstrap",
  "evidence",
  "markdown",
  "projection",
  "test",
]
package_children."tools/codex" = ["catalog"]
package_children."tools/release" = [
  "artifact",
  "construction",
  "performance",
  "publication",
  "readiness",
]

# Packages whose production files may import only the standard library.
standard_library_only = ["internal/domain"]

# Composition roots may contain only their declared production files. Command
# behavior belongs to semantic subpackages, never beside the root assembler.
composition_root_files."internal/cli" = ["app.go"]
composition_root_files."tools/release" = ["commands.go", "main.go"]

# CLI leaf packages are peers. They may depend on the invocation capability
# contract, but never on another command leaf; shared behavior belongs to a
# domain package outside internal/cli.
peer_package_roots."internal/cli" = ["invocation"]

# Repository tools are independent composition roots. Only declared product
# contracts needed by native and real-client acceptance cross into runtime packages.
# Bootstrap failures and command failures share the safe diagnostic owner.
# Installation ownership decides the native credential worker's role.
allowed_import_edges."cmd/aigw" = [
  "internal/cli",
  "internal/clients",
  "internal/presentation",
  "internal/secret",
  "internal/secret/native",
  "internal/upgrade",
]
# The built-in adapter set is the only list of every client outside its adapters.
allowed_import_edges."internal/clients" = [
  "internal/client",
  "internal/client/claude",
  "internal/client/claudedesktop",
  "internal/client/codex",
  "internal/client/hermes",
  "internal/domain",
]
allowed_import_edges."internal/domain" = []
allowed_import_edges."internal/store" = [
  "internal/domain",
]
allowed_import_edges."internal/client" = [
  "internal/discovery",
  "internal/domain",
  "internal/process",
