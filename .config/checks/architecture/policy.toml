  "internal/cli/rollback",
  "internal/cli/rotate",
  "internal/cli/route",
  "internal/cli/setup",
  "internal/cli/status",
  "internal/cli/sync",
  "internal/cli/test",
  "internal/cli/uninstall",
  "internal/cli/update",
  "internal/cli/use",
  "internal/cli/verify",
  "internal/domain",
  "internal/secret",
  "internal/secret/native",
  "internal/secret/probe",
  "internal/store",
  "internal/terminal",
]

# Composition roots may contain only their declared production files. Command
# behavior belongs to semantic subpackages, never beside the root assembler.
composition_root_files."internal/cli" = ["app.go"]
composition_root_files."tools/release" = ["commands.go", "main.go"]

# Command packages are peers. They share CLI behavior only through
# internal/cli/invocation and never import another command package; a use case
# that several commands share belongs to internal/app.
peer_package_roots."internal/cli" = ["invocation"]

# Repository tools are independent composition roots. Only declared product
# contracts needed by native and real-client acceptance cross into runtime packages.
# Bootstrap failures and command failures share the safe diagnostic owner.
# Installation ownership decides the native credential worker's role.
