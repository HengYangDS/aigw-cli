# Declarative SSOT for dual-forge verification gates and native acceptance.
# Consumers must read this file; workflows are projections, not authority.
# mise.toml selects every repository tool; mise.lock resolves immutable assets.
# go.mod remains the Go language/module contract and must match the mise selection.

[toolchain]
go_mod = "go.mod"
mise_config = "mise.toml"
mise_lock = "mise.lock"

[toolchain.github_actions]
checkout = "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
mise = "jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654" # v4.2.4

# Commands that must appear on both GitLab verify and GitHub verify source gates.
[common]
commands = [
  "mise exec --locked -- go run ./tools/ci source",
]

# Active verify.script commands that must be line-exact GitLab script entries.
[common.active_script_commands]
commands = [
  "mise exec --locked -- go run ./tools/ci source",
]

[gitlab]
bootstrap_image = "ghcr.io/jdx/mise@sha256:92dbc3f2573926d8974e4641ad8449f16c323130b9f41c39aff19b7b2f500ef6"
workflow_file = ".gitlab-ci.yml"
runner_tag_variable = "AIGW_GITLAB_RUNNER_TAG"
git_depth = "0"
goproxy_fallback = "https://goproxy.cn|https://proxy.golang.org|direct"
# Untagged release/* branches and their MRs must never open a pipeline.
suppress_untagged_release_branch = true
suppress_release_branch_merge_request = true
# GitLab must not schedule native jobs on runners it cannot administer.
forbid_windows_native_acceptance_job = true
forbid_macos_native_acceptance_job = true
forbid_github_mirror_job = true
# Package plane must not inject provider-specific build metadata.
forbid_package_provider_build_metadata = []

[gitlab.commands]
# GitLab-only verification beyond the common set.
required = [
  "mise exec --locked -- go run ./tools/ci source",
]

[gitlab.package]
required = [
  "mise exec --locked -- go run ./tools/release build-ci build/release dist",
]

[gitlab.release]
required = [
  "mise exec --locked -- go run ./tools/release publish-gitlab dist",
  "job: publish",
  "job: package",
  "artifacts: true",
]

[github.verify]
workflow_file = ".github/workflows/verify.yml"
runner = "${{ fromJSON(vars.AIGW_VERIFY_RUNNER) }}"
permissions = "contents: read"
forbid_pull_request_triggers = true
forbid_gitlab_runner_labels = true
forbid_goproxy_policy = true
forbid_write_permissions = true
forbid_floating_actions = true

[github.verify.commands]
# GitHub verify-only additions and provider identity.
required = [
  "mise exec --locked -- go run ./tools/ci source",
  "mise exec --locked -- go run ./tools/ci native --platform darwin",
  "mise exec --locked -- go run ./tools/ci native --platform linux",
  "mise exec --locked -- go run ./tools/ci native --platform windows",
]

[github.verify.active_script_commands]
commands = [
  "mise exec --locked -- go run ./tools/ci source",
]

[github.release]
workflow_file = ".github/workflows/release.yml"
runner = "${{ fromJSON(vars.AIGW_RELEASE_RUNNER) }}"
permissions = "contents: write"
name = "Release"
tag_filter = 'tags: ["v*"]'
needs = "needs: [native-darwin, native-linux, native-windows]"

[github.release.commands]
required = [
  "mise exec --locked -- go run ./tools/ci source",
  "mise exec --locked -- go run ./tools/ci native --platform darwin",
  "mise exec --locked -- go run ./tools/ci native --platform linux",
  "mise exec --locked -- go run ./tools/ci native --platform windows",
  "AIGW_CHANGELOG_RELEASE_TAG:",
  "mise exec --locked -- go run ./tools/release build-ci build/release dist",
  "mise exec --locked -- go run ./tools/release publish-github dist",
]

[github.release.forbid]
tokens = [
  "aigw-gitlab-macos-arm64",
]

[native.darwin]
runs_on = "macos-latest"
required = [
  "native-darwin:",
  "runs-on: macos-latest",
  "mise exec --locked -- go run ./tools/ci native --platform darwin",
]

[native.linux]
runs_on = "ubuntu-latest"
required = [
  "native-linux:",
  "runs-on: ubuntu-latest",
  "mise exec --locked -- go run ./tools/ci native --platform linux",
]

[native.windows]
runs_on = "windows-latest"
required = [
  "native-windows:",
  "runs-on: windows-latest",
  "mise exec --locked -- go run ./tools/ci native --platform windows",
]
