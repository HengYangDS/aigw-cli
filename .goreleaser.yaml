version: 2

project_name: aigw

builds:
  - id: aigw
    main: ./cmd/aigw
    binary: aigw
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X gitlab.local/dig/misc/agentic-third-party-api/aigw-cli/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "aigw_{{.Version}}_{{.Os}}_{{.Arch}}"
    files:
      - README.md
      - scripts/install.sh
      - scripts/uninstall.sh
      - scripts/install.ps1
      - scripts/uninstall.ps1

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  use: git
